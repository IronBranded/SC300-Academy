  quiz: [
    { q: 'Guest access to Microsoft 365 groups must be reviewed every quarter by group owners, and guests nobody reviews should lose access. How do you plan it?', o: ['Monthly self-review, no change on no response', 'Quarterly review of guests, owners as reviewers, fallback reviewer, if no response remove access, auto-apply', 'Annual manager review with recommendations only', 'An access package with 90-day expiry'], a: 1, obj: 0,
      why: 'Scope, reviewer, fallback, recurrence and default decision together meet the requirement; auto-apply removes access without an admin step.' },
    { q: 'Managers must review their direct reports’ access to an app. Some users have no manager. What do you configure?', o: ['Reviewers: managers, with fallback reviewers', 'Reviewers: group owners', 'Self-review', 'Multi-stage review with no reviewers'], a: 0, obj: 1,
      why: 'Fallback reviewers handle users without a manager.' },
    { q: 'You want reviewers to see a recommendation to deny users who have not signed in for 30 days. Which setting?', o: ['Justification required', 'Decision helpers / recommendations', 'Auto apply results', 'Mail notifications'], a: 1, obj: 1,
      why: 'Recommendations use inactivity (and, with ID Governance, affiliation) to suggest decisions.' },
    { q: 'Auditors need a downloadable record of decisions across all access reviews for the last year. What do you use?', o: ['Sign-in logs', 'Review history reports', 'Identity Secure Score', 'Provisioning logs'], a: 1, obj: 2,

    { q: 'A review ended but denied users still have access. Auto-apply was off. What do you do?', o: ['Restart the review', 'Apply results manually from the review', 'Delete the group', 'Wait for the next recurrence'], a: 1, obj: 3,

MODULES.push({
  id: '04-03', domain: '04', title: 'Privileged Identity Management and Emergency Access', short: 'PIM and Break-glass',
  group: 'Plan and implement privileged access',
  objectives: [
    'Plan and manage Microsoft Entra roles in Microsoft Entra Privileged Identity Management (PIM), including settings and assignments',
    'Plan and manage Azure resources in PIM, including settings and assignments',
    'Plan and configure PIM for Groups',
    'Manage the PIM request and approval process',
    'Analyze PIM audit history and reports',
    'Create and manage break-glass accounts'
  ],
  status: 'GA', verified: '',
  cost: { level: 'none', label: '$0', est: '$0 with P2 from the trial. Azure resource roles use the lab subscription; nothing is deployed.', meter: 'none' },
  portal: 'Entra admin center &gt; ID Governance &gt; Privileged Identity Management: Microsoft Entra roles · Groups · Azure resources · My roles · Approve requests · Alerts · Resource audit',
  ms: [{ t: "Plan and implement privileged access", u: "https://learn.microsoft.com/en-us/training/modules/plan-implement-privileged-access/" }],
  sdk: '<code>Microsoft.Graph.Identity.Governance</code> <code>Az.Resources</code>',
  kql: '<code>AuditLogs</code> (category RoleManagement) <code>SigninLogs</code>',
  prereq: ['00-01', '01-01', '02-03'],
  tactical: 'An eligible assignment is persistence that looks like good hygiene. An attacker holding Privileged Role Administrator can make an account they control <em>eligible</em> for Global Administrator with no expiry and activate it only when needed - nothing is standing, so standing-admin reports stay clean. The PIM alert <em>Roles are being assigned outside of PIM</em> catches the crude version; the quiet one needs a query on <em>Add eligible member to role</em> events whose initiator is not your provisioning process. Then look at activations: <em>Add member to role completed (PIM activation)</em> from an IP or device that account has never used.',
  body: function () { return '' +
    S('concept', 'Why this exists',
      '<p>Standing privilege is the attacker’s best friend. PIM replaces it with <strong>eligible</strong> assignments that a user <strong>activates</strong> for a limited time, with MFA or an authentication context, a justification and, optionally, approval. Every step is logged.</p>' +
      vFlow([
        { t: 'Eligible', s: 'no permissions yet; time-bound or permanent', k: 'd4' },
        { t: 'Request', s: 'justification, ticket, auth context', k: 'd2' },
        { t: 'Approval', s: 'optional; approvers notified', k: 'warn' },
        { t: 'Active', s: 'role works for 1-24 hours', k: 'ok' },
        { t: 'Expired', s: 'back to eligible, logged', k: 'd4' }
      ], 'An activation from start to finish. Each arrow is an audit event.') +
      T('compare', ['PIM covers', 'Assign', 'Typical use'], [
        ['<strong>Microsoft Entra roles</strong>', 'Directory roles at tenant or AU scope', 'Global Administrator, Exchange Administrator...'],
        ['<strong>Azure resources</strong>', 'Azure RBAC roles on management groups, subscriptions, resource groups, resources', 'Owner, User Access Administrator, Contributor'],
        ['<strong>Groups</strong> (PIM for Groups)', 'Just-in-time <em>member</em> or <em>owner</em> of a security or Microsoft 365 group', 'JIT access to whatever the group grants: roles through a role-assignable group, apps, Azure roles']
      ])) +
    S('mechanism', 'How it works under the hood',
      '<h3>Role settings</h3>' +
      '<p>Each role (per resource, for Azure) has its own settings, and they apply to every assignment of that role:</p>' +
      T('config', ['Setting', 'Options', 'Notes'], [
        ['Activation maximum duration', '1 to 24 hours', 'Set per role; keep it short for privileged roles'],
        ['On activation, require', 'None · multifactor authentication · <strong>Microsoft Entra Conditional Access authentication context</strong>', 'Reauthentication covers further activations for 10 minutes'],
        ['Require justification / ticket information', 'Yes / No', 'An information-only field; PIM does not check it against any ticketing system'],
        ['Require approval to activate', 'Yes, with approvers. Entra roles: if none are selected, <em>active</em> Privileged Role Administrators and Global Administrators approve. Azure resource roles: no default, select at least one', 'Name at least two approvers'],
        ['Allow permanent eligible assignment', 'Yes, or expire eligible assignments after a set period', 'Forces a start and end date when permanent is off'],
        ['Allow permanent active assignment', 'Yes, or expire active assignments after a set period', 'Forces a start and end date when permanent is off'],
        ['Require MFA / justification on active assignment', 'Yes / No', 'Applies when an administrator assigns the role as active'],
        ['Notifications', 'Per event: assigned eligible, assigned active, activated - to admins, requestors, approvers', 'Route them to a monitored mailbox']
      ]) +
      '<p>Using an <strong>authentication context</strong> (02-03) instead of plain MFA is the stronger design: it lets a Conditional Access policy demand phishing-resistant MFA and a fresh sign-in for activation. Scope that policy to all users or to the eligible users, <strong>never to the directory role</strong>: during activation the user does not hold the role yet, so a role-scoped policy never applies. Once satisfied, the reauthentication covers further activations for 10 minutes, across Entra roles, Azure resource roles and PIM for Groups. If no enabled policy targets the context, PIM falls back to requiring MFA - but not if the policy is off, report-only, or excludes the user.</p>' +
      C('powershell', String.raw`
# Eligible for Exchange Administrator for 180 days
$role = Get-MgRoleManagementDirectoryRoleDefinition -Filter "displayName eq 'Exchange Administrator'"
New-MgRoleManagementDirectoryRoleEligibilityScheduleRequest -Action 'adminAssign' -PrincipalId $alex.Id -RoleDefinitionId $role.Id -DirectoryScopeId '/' -Justification 'Mail migration project' -ScheduleInfo @{ StartDateTime = (Get-Date); Expiration = @{ Type = 'afterDuration'; Duration = 'P180D' } }

# Activation, as alex, for two hours
New-MgRoleManagementDirectoryRoleAssignmentScheduleRequest -Action 'selfActivate' -PrincipalId $alex.Id -RoleDefinitionId $role.Id -DirectoryScopeId '/' -Justification 'Change 4411: transport rule' -ScheduleInfo @{ StartDateTime = (Get-Date); Expiration = @{ Type = 'afterDuration'; Duration = 'PT2H' } }

# PIM for Groups: alex eligible to become a member of a group for 90 days
New-MgIdentityGovernancePrivilegedAccessGroupEligibilityScheduleRequest -AccessId 'member' -GroupId $grp.Id -PrincipalId $alex.Id -Action 'adminAssign' -Justification 'On-call rota' -ScheduleInfo @{ StartDateTime = (Get-Date); Expiration = @{ Type = 'afterDuration'; Duration = 'P90D' } }`) +
      '<h3>Azure resources</h3>' +
      '<p>In the Azure resources view you <strong>discover</strong> (onboard) a management group or subscription, then manage eligible and active assignments and role settings per role at each scope; assignments inherit downward as in Azure RBAC. Owner and User Access Administrator should never be standing. PIM for Azure resources is the same machinery as Entra roles, surfaced through <code>Az.Resources</code>:</p>' +
      C('powershell', String.raw`
$scope = "/subscriptions/$subId"
$contrib = Get-AzRoleDefinition -Name 'Contributor'
New-AzRoleEligibilityScheduleRequest -Name (New-Guid).Guid -Scope $scope -PrincipalId $alex.Id -RoleDefinitionId "$scope/providers/Microsoft.Authorization/roleDefinitions/$($contrib.Id)" -RequestType 'AdminAssign' -ScheduleInfoStartDateTime (Get-Date -Format o) -ExpirationType 'AfterDuration' -ExpirationDuration 'P90D' -Justification 'Lab'`) +
      '<h3>PIM for Groups</h3>' +

  body: function () { return '' +
    S('concept', 'Why this exists',
      '<p>Entra keeps its own logs for a short time: 7 days on Free, 30 days with P1 or P2. Anything longer, anything queryable across tables, anything that alerts, needs <strong>diagnostic settings</strong> sending the logs somewhere else. This module is the difference between being able to answer "what happened?" in week five and not.</p>' +

      '<h3>Reading logs in the admin center</h3>' +

      '<h3>Diagnostic settings</h3>' +

    why: 'Per-partner inbound trust accepts Fabrikam’s MFA claims only; changing the default would trust every tenant.' },
  { id: 'x09', mod: '01-03', obj: 4, type: 'order',
    stem: 'You are configuring cross-tenant synchronization from a source tenant to a target tenant. Put the actions in the order Microsoft documents.',
    items: ['In the target tenant: allow users sync into this tenant and enable inbound automatic redemption for the source', 'In the source tenant: enable outbound automatic redemption for the target', 'In the source tenant: create the configuration and test the connection', 'In the source tenant: assign users and groups in scope, then start provisioning'],
    why: 'The target must permit inbound sync first; the source then enables outbound redemption, creates and tests the configuration, scopes it and starts the job.' },
  { id: 'x10', mod: '01-03', obj: 2, type: 'single',
    stem: 'A guest user’s company moved from Google Workspace to Microsoft 365. The guest now cannot sign in to your tenant. They must keep all existing group memberships and app assignments. What do you do?',
    o: ['Delete the guest and send a new invitation', 'Reset redemption status on the guest user', 'Convert the guest to a member user', 'Add Google as an identity provider'], a: 1,

  { id: 'x65', mod: '01-03', obj: 5, type: 'yesno',
    stem: 'You are configuring external identities for partners.',
    s: ['SAML/WS-Fed IdP federation can be configured for a partner domain that is DNS-verified in Microsoft Entra ID.', 'For an Entra-verified partner domain, invitation redemption uses the federated IdP first by default.', 'Cross-tenant synchronization changes an existing B2B user’s userType from Guest to Member by default.'],
    a: [true, false, false], pm: [['01-03', 5], ['01-03', 5], ['01-03', 4]],
    why: 'Federation now supports verified and unverified domains. For verified domains Entra ID stays the primary IdP for redemption unless you change the redemption order. Cross-tenant sync creates new users as Member, but an existing B2B user keeps their userType unless the mapping is set to apply Always.' },
  { id: 'x11', mod: '01-04', obj: 5, type: 'order',
    stem: 'You are migrating from AD FS to cloud authentication. Put the steps in order.',
    items: ['Inventory relying parties with the AD FS application activity report', 'Move relying-party applications to Microsoft Entra enterprise apps', 'Enable password hash synchronization', 'Move pilot groups to cloud authentication with staged rollout', 'Convert the domain from federated to managed', 'Decommission AD FS'],
    why: 'Inventory and move apps first, enable the target method, pilot with staged rollout, convert the domain, then remove AD FS.' },
  { id: 'x12', mod: '01-04', obj: 3, type: 'yesno',
    stem: 'Contoso uses pass-through authentication with a single agent installed on its Entra Connect Sync server.',
    s: ['If that server is offline, users cannot sign in to Microsoft 365 by using PTA.', 'Enabling password hash synchronization alongside PTA allows leaked credentials detection.', 'PTA agents require inbound firewall rules from the internet.'],
    a: [true, true, false], pm: [['01-04', 3], ['01-04', 2], ['01-04', 3]],
    why: 'PTA depends on its agents, so one agent is a single point of failure; PHS enables leaked credential detection; agents use outbound connections only.' },
  { id: 'x13', mod: '01-04', obj: 0, type: 'single',
    stem: 'You plan to change sync filtering on your Entra Connect Sync server and want to test the result with no risk to production and keep a warm standby afterwards. What do you deploy?',
    o: ['A second Connect Sync server in staging mode', 'A Cloud Sync agent', 'A second active Connect Sync server', 'Connect Health for sync'], a: 0,
    why: 'A staging-mode server runs imports and syncs without exporting, so you can inspect results, and it can be promoted if the active server fails.' },
  { id: 'x14', mod: '01-04', obj: 6, type: 'single',
    stem: 'You need email alerts when Entra Connect Sync reports errors such as duplicate UPNs, and reports of failed AD FS sign-ins by IP address. What do you use?',
    o: ['Microsoft Entra Connect Health', 'ID Protection', 'Defender for Cloud Apps', 'A diagnostic setting to Event Hubs'], a: 0,
    why: 'Connect Health provides sync error reports and alerts, and the AD FS risky IP report.' },

  /* ---------------- Domain 2 ---------------- */
  { id: 'x15', mod: '02-01', obj: 1, type: 'yesno',
    stem: 'You are configuring authentication methods for a new tenant.',
    s: ['A Temporary Access Pass can be used to register a passkey without the user ever having a password.', 'Passkey profiles can allow synced passkeys for one group while requiring device-bound passkeys with attestation for another.', 'Managing authentication methods in the legacy MFA service settings is still the recommended approach.'],
    a: [true, true, false], pm: [['02-01', 1], ['02-01', 1], ['02-01', 2]],
    why: 'TAP bootstraps passwordless registration; passkey profiles target groups with different passkey types; method management in legacy MFA and SSPR policies was retired in September 2025.' },
  { id: 'x16', mod: '02-01', obj: 5, type: 'multi', pick: 2,
    stem: 'A synced user’s account is compromised. The attacker must lose access to Microsoft 365 as fast as possible. Which two actions should you perform first? Each correct answer presents part of the solution.',
    o: ['Disable the account in AD DS and in Microsoft Entra ID', 'Revoke the user’s sign-in sessions', 'Remove the user’s licences', 'Delete the user in Microsoft Entra ID', 'Run an access review'], a: [0, 1],
    why: 'Disable in both places (a cloud-only change is overwritten by sync) and revoke refresh tokens and sessions; CAE-capable services then reject existing tokens quickly.' },
  { id: 'x17', mod: '02-01', obj: 3, type: 'single',
    stem: 'SSPR is enabled for all users with one method required. Administrators report that they must register two methods. Why?',
    o: ['SSPR requires two methods for everyone', 'Administrators are always covered by a separate, stricter SSPR policy that requires two methods', 'The registration campaign is enabled', 'Security defaults override SSPR'], a: 1,
    why: 'Administrator accounts always have SSPR enabled under a two-gate policy you cannot weaken.' },
  { id: 'x18', mod: '02-01', obj: 6, type: 'single',
    stem: 'Users must not be able to set passwords containing “Northwind” or store names, both in the cloud and when changing passwords on domain-joined PCs. What do you deploy?',
    o: ['Smart lockout', 'A custom banned password list, plus the password protection proxy and DC agents on-premises', 'Seamless SSO', 'Password writeback'], a: 1,
    why: 'The custom banned list enforces in the cloud; the on-premises agents enforce the same lists on DC password changes.' },
  { id: 'x19', mod: '02-01', obj: 4, type: 'single',
    stem: 'You deploy Windows Hello for Business to hybrid joined devices. Users must access on-premises file shares with SSO, and you do not want to deploy certificates. What do you also configure?',
    o: ['Certificate trust', 'Microsoft Entra Kerberos (cloud Kerberos trust)', 'Seamless SSO', 'Pass-through authentication'], a: 1,
    why: 'Cloud Kerberos trust uses Entra Kerberos to issue partial TGTs and needs no PKI.' },
  { id: 'x20', mod: '02-02', obj: 2, type: 'yesno',
    stem: 'Policy A applies to all users and requires MFA. Policy B applies to the Finance group and requires a compliant device. Policy C blocks sign-ins from a named location called Blocked Countries. All three are enabled.',
    s: ['A Finance user on a compliant device at the office must satisfy MFA and device compliance.', 'A Finance user signing in from a blocked country with MFA and a compliant device is granted access.', 'A user in no group with MFA is granted access from the office.'],
    a: [true, false, true], pm: [['02-02', 2], ['02-02', 2], ['02-02', 1]],
    why: 'All applicable grant controls are enforced together, and block overrides any grant.' },
  { id: 'x21', mod: '02-02', obj: 1, type: 'code',
    stem: 'You create a Conditional Access policy with Microsoft Graph PowerShell to block legacy authentication without affecting users yet. Complete the policy.',
    code: "$p = @{\n  displayName = 'CA001-BlockLegacyAuth'\n  state = '[[0]]'\n  conditions = @{\n    users = @{ includeUsers = @('All'); excludeGroups = @($bg) }\n    applications = @{ includeApplications = @('All') }\n    clientAppTypes = @('exchangeActiveSync', '[[1]]')\n  }\n  grantControls = @{ operator = 'OR'; builtInControls = @('[[2]]') }\n}\nNew-MgIdentityConditionalAccessPolicy -BodyParameter $p",
    blanks: [
      { o: ['enabled', 'enabledForReportingButNotEnforced', 'disabled'], a: 1 },
      { o: ['browser', 'mobileAppsAndDesktopClients', 'other'], a: 2 },
      { o: ['mfa', 'block', 'compliantDevice'], a: 1 }],
    pm: [['02-02', 3], ['02-02', 1], ['02-02', 2]],
    why: 'Report-only is enabledForReportingButNotEnforced; legacy protocols are the exchangeActiveSync and other client app types; the control is block.' },
  { id: 'x22', mod: '02-02', obj: 3, type: 'single',
    stem: 'A user reports AADSTS53003 when opening an app. You want to know which policy blocked the sign-in and why others did not apply, for that exact sign-in. Where do you look?',
    o: ['The What If tool', 'The Conditional Access tab of the sign-in log entry', 'The audit log', 'Identity Secure Score'], a: 1,
    why: 'The sign-in’s Conditional Access tab records each policy’s actual result. What If simulates a hypothetical sign-in.' },
  { id: 'x23', mod: '02-02', obj: 4, type: 'single',
    stem: 'You want to create Microsoft’s recommended policy requiring phishing-resistant MFA for administrators, with the least effort and without affecting sign-ins until you review its impact. What do you do?',
    o: ['Enable security defaults', 'Create the policy from a Conditional Access template and leave it in report-only', 'Enable per-user MFA for administrators', 'Create an authentication context'], a: 1,
    why: 'Templates provide the recommended configuration and default to report-only.' },
  { id: 'x24', mod: '02-02', obj: 1, type: 'single',
    stem: 'Attackers are phishing users with device code sign-in prompts. Users never need device code flow except on meeting-room devices. Which Conditional Access condition do you use to block it?',
    o: ['Client apps: Other clients', 'Authentication flows: device code flow', 'Device platforms: Windows', 'Sign-in risk'], a: 1,
    why: 'The authentication flows condition targets device code flow specifically; exclude the meeting-room devices with a device filter or group.' },
  { id: 'x25', mod: '02-03', obj: 2, type: 'single',
    stem: 'After enabling strict location enforcement for continuous access evaluation, users on a split-tunnel VPN are repeatedly signed out of SharePoint. What is the cause?',
    o: ['Token protection is enabled', 'The IP address SharePoint sees is not in the allowed named locations, although the IP Entra saw was', 'Sign-in frequency is set to every time', 'The users are not licensed for CAE'], a: 1,
    why: 'Strict mode enforces location at the resource; split tunnelling produces a different IP at the resource than at Entra.' },
  { id: 'x26', mod: '02-03', obj: 3, type: 'multi', pick: 2,
    stem: 'One SharePoint site holds merger documents. Opening it must require phishing-resistant MFA; the rest of SharePoint must not change. Which two actions should you perform? Each correct answer presents part of the solution.',
    o: ['Create an authentication context and apply it to the site', 'Create a Conditional Access policy that targets the authentication context and requires the phishing-resistant authentication strength', 'Create a Conditional Access policy for Office 365 SharePoint Online requiring phishing-resistant MFA', 'Configure a protected action', 'Enable app enforced restrictions'], a: [0, 1],
    why: 'Authentication context lets the site request step-up; a policy targeting the context enforces it. Targeting SharePoint Online would affect every site.' },
  { id: 'x27', mod: '02-03', obj: 4, type: 'single',
    stem: 'Administrators must complete phishing-resistant MFA immediately before deleting or updating Conditional Access policies, even in an existing session. What do you configure?',
    o: ['PIM approval for Conditional Access Administrator', 'Protected actions using an authentication context', 'Sign-in frequency every time for all admins', 'A restricted management administrative unit'], a: 1,
    why: 'Protected actions bind an authentication context to specific permissions such as updating CA policies.' },
  { id: 'x28', mod: '02-03', obj: 1, type: 'single',
    stem: 'Global Administrators may sign in only from privileged access workstations. PAWs have extensionAttribute1 set to “PAW” and are Intune compliant. What should the policy use?',
    o: ['Device platforms condition', 'Filter for devices on extensionAttribute1 and isCompliant', 'Named locations', 'Require hybrid joined device'], a: 1,
    why: 'Filter for devices matches device attributes; platform is self-reported and cannot identify specific devices.' },
  { id: 'x29', mod: '02-04', obj: 0, type: 'yesno',
    stem: 'You are migrating risk-based policies before October 1, 2026.',
    s: ['After the retirement, user risk should be enforced with a Conditional Access policy that uses the user risk condition.', 'Microsoft’s documented user risk policy uses the Require risk remediation grant, which also requires an authentication strength.', 'A sign-in risk policy that requires MFA can be satisfied by users who have not registered any MFA method.'],
    a: [true, true, false], pm: [['02-04', 0], ['02-04', 0], ['02-04', 1]],
    why: 'Legacy ID Protection policies have a retirement date of October 1, 2026, with no automatic migration; Conditional Access replaces them. Require risk remediation auto-selects an authentication strength (older items expect password change + MFA with require all). Unregistered users cannot satisfy MFA and are blocked.' },
  { id: 'x30', mod: '02-04', obj: 3, type: 'single',
    stem: 'An investigation confirms that an attacker used Priya’s account. You want the user risk policy to force a secure password change at her next sign-in. What do you do?',
    o: ['Dismiss user risk', 'Confirm user compromised', 'Confirm sign-in safe', 'Delete her risky sign-ins'], a: 1,
    why: 'Confirming compromise sets user risk to high, which the user risk policy then enforces.' },
  { id: 'x31', mod: '02-04', obj: 2, type: 'single',
    stem: 'Users still using SMS for MFA should be prompted at sign-in to set up Microsoft Authenticator, and may postpone it only a limited number of times. What do you configure?',
    o: ['The registration campaign in Authentication methods', 'Security defaults', 'The MFA registration policy with a 14-day grace', 'Report suspicious activity'], a: 0,
    why: 'The registration campaign nudges users to register a stronger method, with limited snoozes.' },
  { id: 'x32', mod: '02-04', obj: 4, type: 'single',
    stem: 'A client secret for a single-tenant app registration was published in a public repository. You must block the service principal from signing in outside your corporate IP ranges. What do you need?',
    o: ['A user risk policy', 'Conditional Access for workload identities with Workload Identities Premium', 'Managed identity conversion', 'Defender for Cloud Apps session policy'], a: 1,
    why: 'CA for workload identities, which needs Workload Identities Premium, can block single-tenant service principals by location or risk.' },
  { id: 'x33', mod: '02-05', obj: 1, type: 'single',
    stem: 'You must give remote staff access to 40 internal web apps, file shares and RDP hosts as quickly as possible, replacing the VPN. Different Conditional Access per app is not required yet. What do you configure?',
    o: ['Application Proxy for each app', 'Private Access with Quick Access', 'Per-app Private Access for each resource', 'Remote networks'], a: 1,
    why: 'Quick Access publishes many FQDN and IP segments in one app and supports non-HTTP protocols. Application Proxy handles web apps only.' },
  { id: 'x34', mod: '02-05', obj: 3, type: 'yesno',
    stem: 'You enable the Microsoft traffic profile in Global Secure Access.',
    s: ['It requires a Microsoft Entra Suite licence.', 'With GSA signaling enabled, sign-in logs keep the user’s original public IP address.', 'A Conditional Access policy can require that Microsoft 365 access comes through a compliant network.'],
    a: [false, true, true], pm: [['02-05', 3], ['02-05', 3], ['02-05', 3]],
    why: 'The Microsoft traffic profile needs only Entra ID P1 or P2. Source IP restoration preserves the original IP. The compliant network condition is available once traffic flows through GSA.' },
  { id: 'x35', mod: '02-05', obj: 0, type: 'yesno',
    stem: 'You are deploying the Global Secure Access client for Windows.',
    s: ['A Microsoft Entra joined 64-bit Windows 11 device can tunnel Microsoft, Internet Access and Private Access traffic.', 'A personal Windows device that is only Microsoft Entra registered can tunnel Internet Access traffic.', 'Azure Virtual Desktop multi-session hosts are supported.'],
    a: [true, false, false], pm: [['02-05', 0], ['02-05', 0], ['02-05', 0]],
    why: 'Joined and hybrid joined devices get every profile. Registered BYOD devices are supported in preview for Private Access traffic only. AVD single-session and Windows 365 are supported; multi-session is not.' },
  { id: 'x36', mod: '02-05', obj: 2, type: 'single',
    stem: 'All internet traffic must block malware and adult categories for every user, while only the Sales department is additionally blocked from social media. How do you configure Internet Access?',
    o: ['One security profile linked by CA to all users', 'Malware and adult categories in the baseline profile; social media in a security profile linked by a CA policy scoped to Sales', 'A Defender for Cloud Apps session policy', 'Named locations for Sales'], a: 1,
    why: 'The baseline profile applies to all traffic without CA; per-group profiles are applied through CA with the GSA security profile session control.' },

  /* ---------------- Domain 3 ---------------- */
  { id: 'x37', mod: '03-01', obj: 0, type: 'single',
    stem: 'A GitHub Actions workflow deploys infrastructure to Azure. Your security team forbids storing secrets in GitHub. What should the workflow authenticate as?',
    o: ['A user account with MFA excluded', 'An app registration or user-assigned managed identity with a federated credential for the repository', 'A system-assigned managed identity', 'A service principal with a client secret stored as a GitHub secret'], a: 1,
    why: 'Workload identity federation exchanges GitHub’s OIDC token for an Entra token; no secret exists.' },
  { id: 'x38', mod: '03-01', obj: 3, type: 'code',
    stem: 'Code on an Azure VM must obtain a token for Azure Storage with the VM’s system-assigned managed identity. Complete the request.',
    code: "$t = Invoke-RestMethod -Headers @{ [[0]] = 'true' } -Uri 'http://[[1]]/metadata/identity/oauth2/token?api-version=2018-02-01&resource=[[2]]'",
    blanks: [
      { o: ['Authorization', 'Metadata', 'x-ms-client-id'], a: 1 },
      { o: ['login.microsoftonline.com', '169.254.169.254', 'management.azure.com'], a: 1 },
      { o: ['https://storage.azure.com/', 'https://graph.microsoft.com/', 'https://vault.azure.net'], a: 0 }],
    pm: [['03-01', 3], ['03-01', 3], ['03-01', 3]],
    why: 'IMDS at 169.254.169.254 requires the Metadata: true header; the resource is the audience of the token you want.' },
  { id: 'x39', mod: '03-01', obj: 1, type: 'multi', pick: 2,
    stem: 'Twenty VMs in a scale set must use one identity to read a Key Vault, and access must be configured before the scale set is deployed. Which two actions should you perform? Each correct answer presents part of the solution.',
    o: ['Create a user-assigned managed identity', 'Grant the identity the Key Vault Secrets User role on the vault', 'Enable a system-assigned identity on each VM', 'Create an app registration with a secret', 'Grant the identity Contributor on the subscription'], a: [0, 1],
    why: 'A user-assigned identity exists before the VMs and can be shared; a data-plane role on the vault grants least privilege.' },
  { id: 'x40', mod: '03-02', obj: 2, type: 'yesno',
    stem: 'You publish an internal IIS app that uses Windows Integrated Authentication through Microsoft Entra Application Proxy.',
    s: ['The private network connector requires inbound port 443 from the internet.', 'With Microsoft Entra ID pre-authentication, Conditional Access applies before the request reaches the server.', 'SSO requires Kerberos constrained delegation from the connector’s computer account to the app’s SPN.'],
    a: [false, true, true], pm: [['03-02', 2], ['03-02', 2], ['03-02', 2]],
    why: 'Connectors are outbound only; Entra pre-authentication enables CA; KCD provides SSO to Windows auth apps.' },
  { id: 'x41', mod: '03-02', obj: 5, type: 'single',
    stem: 'Users must be able to consent only to apps from verified publishers that request User.Read, openid, profile and email. Everything else must go to a review team. Which configuration meets this?',
    o: ['Do not allow user consent; enable the admin consent workflow', 'Allow user consent for verified publishers for selected permissions; classify those permissions as low impact; enable the admin consent workflow', 'Let users consent to all apps; create an app governance policy', 'Enable app instance property lock'], a: 1,
    why: 'Permission classifications define low impact, the user consent setting limits consent to them from verified publishers, and the workflow routes the rest.' },
  { id: 'x42', mod: '03-02', obj: 1, type: 'single',
    stem: 'A support engineer must manage SAML SSO and user assignments for every enterprise app but must not configure Application Proxy. Which role follows least privilege?',
    o: ['Application Administrator', 'Cloud Application Administrator', 'Global Administrator', 'Application Developer'], a: 1,
    why: 'Cloud Application Administrator equals Application Administrator minus Application Proxy.' },
  { id: 'x43', mod: '03-02', obj: 3, type: 'single',
    stem: 'A SaaS app’s SAML SSO stopped working this morning for everyone. Nothing changed in Conditional Access. What is the most likely cause to check first?',
    o: ['The SAML signing certificate expired', 'The users’ licences expired', 'The app is not in a collection', 'User consent was disabled'], a: 0,
    why: 'Signing certificates expire (three years by default); an expiry breaks SSO for all users at once.' },
  { id: 'x44', mod: '03-02', obj: 4, type: 'single',
    stem: 'Users are assigned to an enterprise app through the group All-Sales, which contains a nested group Sales-West. Sales-West members get AADSTS50105. Assignment is required. Why?',
    o: ['Sales-West needs a licence', 'Nested group membership is not expanded for app assignment', 'The app needs an app role', 'Consent was not granted'], a: 1,
    why: 'App assignment applies to direct members of assigned groups only.' },
  { id: 'x45', mod: '03-03', obj: 3, type: 'yesno',
    stem: 'An app registration requests Microsoft Graph Mail.Read as a delegated permission and User.Read.All as an application permission. No consent has been granted.',
    s: ['A user can consent to User.Read.All for themselves.', 'After consent, delegated Mail.Read lets the app read only mailboxes the signed-in user can access.', 'The permissions are recorded on the app registration, but granted permissions attach to the service principal.'],
    a: [false, true, true], pm: [['03-03', 3], ['03-03', 3], ['03-03', 0]],
    why: 'Application permissions always need admin consent. Delegated access is the intersection of the permission and the user’s rights. Requests live on the application object; grants attach to the service principal.' },
  { id: 'x46', mod: '03-03', obj: 4, type: 'single',
    stem: 'Your expenses API must let a partner’s daemon app call it without a user, and you want the permission to appear in the partner’s API permissions list as an application permission. What do you define?',
    o: ['A scope under Expose an API', 'An app role with allowed member types set to Applications', 'An optional claim', 'A redirect URI'], a: 1,
    why: 'App roles allowed for Applications surface to other apps as application permissions.' },
  { id: 'x47', mod: '03-03', obj: 2, type: 'single',
    stem: 'A JavaScript single-page app with no backend needs to sign users in and call Graph. How should you configure authentication on its app registration?',
    o: ['Web platform with a client secret', 'SPA platform redirect URI; authorization code flow with PKCE', 'Enable implicit grant for access tokens', 'Enable allow public client flows'], a: 1,
    why: 'SPAs use auth code with PKCE on the SPA platform; implicit grant is legacy and discouraged.' },
  { id: 'x48', mod: '03-04', obj: 4, type: 'single',
    stem: 'Users on unmanaged devices may view files in any sanctioned cloud app in the browser, but downloads of files labelled Highly Confidential must be blocked. Users must not bypass the control with desktop clients. What do you create in Defender for Cloud Apps?',
    o: ['A file policy only', 'A session policy blocking the downloads, and an access policy blocking native clients', 'An activity policy', 'An app governance policy'], a: 1,
    why: 'Session policies control downloads in the session; an access policy blocks native clients, which cannot be proxied.' },
  { id: 'x49', mod: '03-04', obj: 0, type: 'single',
    stem: 'You need continuous cloud discovery attributed to users and devices on managed Windows endpoints, without deploying a log collector. What do you use?',
    o: ['Snapshot reports', 'Defender for Endpoint integration', 'An app connector', 'Conditional Access app control'], a: 1,
    why: 'Defender for Endpoint feeds discovery continuously with user and device context.' },
  { id: 'x50', mod: '03-04', obj: 5, type: 'single',
    stem: 'You must be alerted to OAuth apps that hold high-privilege Microsoft Graph permissions but have not used them for 90 days, and optionally disable them automatically. What do you configure?',
    o: ['An access review of enterprise apps', 'An app governance policy', 'A cloud discovery anomaly policy', 'Permission classifications'], a: 1,
    why: 'App governance policies evaluate OAuth apps’ permissions and usage and can disable them.' },

  /* ---------------- Domain 4 ---------------- */
  { id: 'x51', mod: '04-01', obj: 2, type: 'yesno',
    stem: 'You create an access package in the Sales catalog containing a group, an enterprise app role and a SharePoint site.',
    s: ['Each resource must be added to the Sales catalog before the package can use it.', 'A policy can require two stages of approval and expire assignments after 90 days.', 'External users can request the package even if the catalog is not enabled for external users, provided the policy allows it.'],

  { id: 'x52', mod: '04-01', obj: 5, type: 'single',

  { id: 'x53', mod: '04-01', obj: 4, type: 'single',

  { id: 'x54', mod: '04-02', obj: 1, type: 'multi', pick: 2,
    stem: 'Managers must review their direct reports’ access to the finance app each quarter. Users whose manager does not respond must lose access, without an administrator applying results. Which two settings do you configure? Each correct answer presents part of the solution.',
    o: ['If reviewers don’t respond: Remove access', 'Auto apply results to resource', 'If reviewers don’t respond: No change', 'Reviewers: group owners', 'Justification required: off'], a: [0, 1],

  { id: 'x55', mod: '04-02', obj: 3, type: 'single',

    o: ['Delete the review', 'Stop the review, then apply results', 'Send reminders', 'Reset decisions'], a: 1,

  { id: 'x56', mod: '04-02', obj: 2, type: 'single',
    stem: 'Auditors want a downloadable report of every decision made in access reviews over the last year, including who decided and why. What do you provide?',

  summary: 'What a Microsoft Entra tenant actually is, which objects live in it, how they differ from Active Directory, and how roles and scopes decide who can change them.',
  ms: [MSD("Explore identity in Microsoft Entra ID", "https://learn.microsoft.com/training/modules/explore-identity-azure-active-directory"), MSD("Implement initial configuration of Microsoft Entra ID", "https://learn.microsoft.com/en-us/training/modules/implement-initial-configuration-of-azure-active-directory/"), MSD('What is Microsoft Entra?', 'https://learn.microsoft.com/entra/fundamentals/what-is-entra'), MSD('Microsoft Entra built-in roles', 'https://learn.microsoft.com/entra/identity/role-based-access-control/permissions-reference')],
  mods: ['01-01', '01-02'],
  units: [
    { t: 'A tenant is a directory, a boundary and a trust anchor',
      body: '<p>A <strong>tenant</strong> is one instance of Microsoft Entra ID, created when an organisation first signs up for a Microsoft cloud service. It holds a directory of objects, issues tokens for them, and is the boundary for policy: Conditional Access, authentication methods and settings apply inside one tenant and nowhere else. Every tenant has a permanent <strong>tenant ID</strong> (a GUID) and an initial domain ending in <code>.onmicrosoft.com</code>.</p>' +
        '<p>Other services trust the tenant rather than holding their own identities. An Azure subscription trusts exactly one tenant; Microsoft 365 workloads use the tenant’s users and groups; applications register in it. That is why moving a subscription between tenants breaks every role assignment on it.</p>',
      vis: vNest([
        { t: 'Microsoft Entra tenant', s: 'tenant ID, initial domain, policies', k: 'd1' },
        { t: 'Directory', s: 'the objects', k: 'acc', chips: ['Users', 'Groups', 'Devices', 'Applications', 'Service principals', 'Administrative units'] }
      ], 'Everything in this guide acts on objects inside one tenant, under that tenant’s policies.'),
      terms: [['Tenant', 'A dedicated instance of Microsoft Entra ID for one organisation: its directory, policies and token issuer.'],
              ['Tenant ID', 'The permanent GUID that identifies a tenant; used in endpoints, cross-tenant settings and logs.'],
              ['Initial domain', 'The <code>.onmicrosoft.com</code> domain created with the tenant; it cannot be removed.'],
              ['Verified domain', 'A custom domain whose ownership was proven with a DNS record; only verified domains can be UPN suffixes.']] },
    { t: 'Objects and their source of authority',
      body: '<p>Users, groups and devices are directory objects with properties. The property that matters most for administration is the <strong>source of authority</strong>: an object created in the cloud is edited in the cloud; an object synchronized from Active Directory is edited on-premises, and most of its properties are read-only in Entra. A user’s <code>userType</code> (Member or Guest) is separate from where it came from - a guest can be a member, and a member can be external.</p>' +
        '<p>Entra is not Active Directory in the cloud. There are no OUs, no Group Policy, no LDAP or Kerberos for your servers (except through Entra Kerberos and Domain Services), and no forest trusts. Structure comes from groups, administrative units and attributes instead.</p>',
      vis: vVs({ t: 'Active Directory DS', k: 'd1', items: ['OUs and Group Policy', 'Kerberos and NTLM, LDAP', 'Domain controllers you run', 'Forests and trusts'] },
                { t: 'Microsoft Entra ID', k: 'd2', items: ['Groups, AUs and attributes', 'OAuth 2.0, OIDC, SAML', 'A global service Microsoft runs', 'Tenants and cross-tenant settings'] },
                'Same identities, different machinery. Questions often hinge on a feature that exists on one side only.'),
      terms: [['Source of authority', 'Where an object is mastered: Entra (cloud) or Active Directory (synced). The mastered side is where you edit it.'],
              ['userType', 'Member or Guest. Controls default permissions; independent of whether the user is internal or external.'],
              ['Directory object', 'Any entity in the tenant with an object ID: user, group, device, application, service principal and so on.'],
              ['Soft delete', 'Deleted users, groups and applications are kept for 30 days and can be restored with their memberships.']] },
    { t: 'Roles, assignments and scope',
      body: '<p>A <strong>role definition</strong> is a list of permissions such as <code>microsoft.directory/users/password/update</code>. A <strong>role assignment</strong> gives a role to a principal at a <strong>scope</strong>: the whole tenant, an administrative unit, or a single object such as one application. Permissions from every assignment add up; there is no deny.</p>' +
        '<p>Microsoft Entra roles govern the directory and Microsoft 365. <strong>Azure RBAC</strong> roles govern Azure resources and are assigned on subscriptions and below. The two systems meet in only one place: a Global Administrator can elevate to User Access Administrator at the Azure root.</p>',
      vis: vFlow([
        { t: 'Role definition', s: 'what can be done', k: 'd1' },
        { t: 'Principal', s: 'user, role-assignable group, service principal', k: 'acc' },
        { t: 'Scope', s: '/ · /administrativeUnits/{id} · /{objectId}', k: 'd2' },
        { t: 'Assignment', s: 'active or eligible (PIM)', k: 'ok' }
      ], 'Every administrative permission is these three things joined by an assignment.'),
      terms: [['Role definition', 'A named set of permissions; built-in or custom.'],
              ['Role assignment', 'The link between a principal, a role definition and a scope.'],
              ['Scope', 'Where an assignment applies: tenant, administrative unit or a single resource.'],
              ['Role-assignable group', 'A group created with isAssignableToRole so that Entra roles can be assigned to it; cannot be dynamic.'],
              ['Azure RBAC', 'The separate role system for Azure resources, assigned on management groups, subscriptions, resource groups and resources.']] },
    { t: 'Administrative units',
      body: '<p>An <strong>administrative unit</strong> is a container that exists only to restrict scope. It holds users, groups or devices - by assignment or a dynamic rule - and roles assigned at its scope reach only those objects. A <strong>restricted management</strong> AU inverts the idea: it protects its members from tenant-scoped administrators, so only admins assigned at the AU can change them.</p>' +
        '<p>AUs do not nest, do not grant access to anything, and do not pull in the members of a group you add to them.</p>',
      vis: vCards([
        { t: 'AU-Quebec', s: 'Dynamic: user.state -eq "QC". Helpdesk Administrator scoped here resets only these users.', k: 'd1' },
        { t: 'AU-Executives', s: 'Restricted management. Even Global Administrators need an assignment at this scope to edit members.', k: 'warn' },
        { t: 'Group in an AU', s: 'The group object is in scope; its members are not.', k: 'acc' }
      ], 'Three administrative unit patterns and the trap that goes with them.'),
      terms: [['Administrative unit', 'A container used to scope role assignments to a subset of users, groups or devices.'],
              ['Restricted management administrative unit', 'An AU whose members can be modified only by administrators assigned at the AU scope.'],
              ['Dynamic administrative unit', 'An AU whose user or device membership is computed from a rule.']] }
  ]
});

LEARN.push({
  id: 'L2', title: 'Tokens, Protocols and Sessions', short: 'Tokens and protocols', mins: 25,
  summary: 'How a sign-in turns into tokens: OAuth 2.0, OpenID Connect, SAML and WS-Fed, what is inside an access token, how refresh tokens and the Primary Refresh Token keep sessions alive, and how sessions end.',
  ms: [MSD("Explore identity in Microsoft Entra ID", "https://learn.microsoft.com/training/modules/explore-identity-azure-active-directory"), MSD("Register apps using Microsoft Entra ID", "https://learn.microsoft.com/en-us/training/modules/register-apps-use-microsoft-entra-id/"), MSD('OAuth 2.0 and OpenID Connect protocols', 'https://learn.microsoft.com/entra/identity-platform/v2-protocols'), MSD('Access tokens', 'https://learn.microsoft.com/entra/identity-platform/access-tokens'), MSD('Primary Refresh Token', 'https://learn.microsoft.com/entra/identity/devices/concept-primary-refresh-token')],
  mods: ['02-01', '02-03', '03-03'],
  units: [
    { t: 'Four protocols, one job',
      body: '<p>Every protocol here answers the same question - how does an app learn who the user is, or get permission to call an API - with different formats. <strong>OAuth 2.0</strong> is authorisation: an app obtains an <em>access token</em> to call an API. <strong>OpenID Connect</strong> adds authentication on top, returning an <em>ID token</em> about the user. <strong>SAML 2.0</strong> and <strong>WS-Federation</strong> are older XML-based single sign-on protocols that deliver a signed assertion to the application; most SaaS apps and AD FS speak them.</p>' +
        '<p>For the exam: modern apps you register use OIDC and OAuth; gallery SaaS apps are often SAML; partner IdPs that are not Entra connect with SAML or WS-Fed.</p>',
      vis: vCards([
        { t: 'OAuth 2.0', s: 'Access tokens to call APIs. Scopes and app roles.', k: 'd2', tag: 'authorisation' },
        { t: 'OpenID Connect', s: 'ID token saying who signed in. Built on OAuth.', k: 'd2', tag: 'sign-in' },
        { t: 'SAML 2.0', s: 'Signed XML assertion posted to the app. Most SaaS SSO.', k: 'd3', tag: 'sign-in' },
        { t: 'WS-Federation', s: 'Older XML protocol; AD FS and some partner IdPs.', k: 'd3', tag: 'sign-in' }
      ], 'Which protocol carries what.'),
      terms: [['OAuth 2.0', 'The authorisation framework apps use to obtain access tokens for APIs.'],
              ['OpenID Connect', 'An authentication layer on OAuth 2.0 that returns an ID token describing the signed-in user.'],
              ['SAML 2.0', 'An XML-based SSO protocol in which the IdP posts a signed assertion to the application.'],
              ['WS-Federation', 'An older XML-based federation protocol used by AD FS and some identity providers.']] },
    { t: 'What is inside an access token',
      body: '<p>An Entra access token is a signed JSON Web Token. Its claims say who it is for, who it is about and what it allows. Resources validate the signature and the claims, and never call Entra to check the token - which is why a token keeps working until it expires unless the resource supports continuous access evaluation.</p>' +
        '<p>Delegated tokens carry the user in <code>oid</code> and the granted permissions in <code>scp</code>. App-only tokens carry the application’s permissions in <code>roles</code> and no user. Group and app role claims appear only when configured.</p>',
      vis: vAnat([
        { l: 'aud', t: 'the API the token is for (for example https://graph.microsoft.com)', k: 'd2' },
        { l: 'iss / tid', t: 'the issuing tenant', k: 'd1' },
        { l: 'oid / sub', t: 'the user or service principal', k: 'd1' },
        { l: 'scp', t: 'delegated permissions granted', k: 'acc' },
        { l: 'roles', t: 'application permissions or app roles', k: 'acc' },
        { l: 'amr / acrs', t: 'how the user authenticated; authentication context satisfied', k: 'd3' },
        { l: 'exp', t: 'expiry: by default a random 60-90 minutes (75 on average)', k: 'warn' }
      ], 'The claims you read when a token does not do what you expect.', 'Access token (decoded)'),
      terms: [['Access token', 'A short-lived token presented to an API to prove what the caller may do.'],
              ['ID token', 'An OpenID Connect token describing the user to the client application.'],
              ['JWT', 'JSON Web Token: a signed, base64url-encoded set of claims.'],
              ['scp claim', 'The delegated permissions (scopes) in a user token.'],
              ['roles claim', 'Application permissions in an app-only token, or app roles assigned to a user.']] },
    { t: 'Refresh tokens and the Primary Refresh Token',
      body: '<p>Access tokens are short-lived by design, so clients also receive a <strong>refresh token</strong> to obtain new ones silently. Those silent refreshes are the <em>non-interactive sign-ins</em> in your logs. On Entra joined, hybrid joined and registered devices, Windows and the mobile brokers hold a <strong>Primary Refresh Token</strong> (PRT): a device-bound token issued at sign-in that provides SSO to every Entra app and carries device claims for Conditional Access.</p>' +
        '<p>Because refresh tokens can outlive password changes, stealing one is valuable. Revoking sessions invalidates them; token protection binds them to the device so a copy is useless elsewhere.</p>',
      vis: vFlow([
        { t: 'Interactive sign-in', s: 'password, passkey, MFA', k: 'd1' },
        { t: 'PRT or refresh token', s: 'long-lived, silent', k: 'acc' },
        { t: 'Access token', s: '60-90 minutes by default', k: 'd2' },
        { t: 'API call', s: 'resource validates the token', k: 'ok' }
      ], 'One interactive sign-in, many silent refreshes. Replay attacks live in the middle box.', { loop: 'refresh silently until revoked or expired' }),
      terms: [['Refresh token', 'A long-lived token a client uses to obtain new access tokens without prompting the user.'],
              ['Primary Refresh Token', 'A device-bound token on joined or registered devices that provides SSO and device claims.'],
              ['Non-interactive sign-in', 'A sign-in performed by a client on the user’s behalf, such as a token refresh.'],
              ['Token protection', 'A Conditional Access session control that binds refresh tokens to the device they were issued to.']] },
    { t: 'How sessions end',
      body: '<p>A session ends when a token expires, when policy forces reauthentication (sign-in frequency), or when something revokes it. <strong>Revoking sign-in sessions</strong> invalidates refresh tokens and session cookies; already-issued access tokens stay valid until they expire - unless the resource supports <strong>continuous access evaluation</strong>, in which case it rejects them after critical events such as the account being disabled or the password reset.</p>',
      vis: vVs({ t: 'Without CAE', k: 'warn', items: ['Revoke kills refresh tokens', 'Access token works until expiry (60-90 minutes by default)', 'IP changes are not re-evaluated'] },
               { t: 'With CAE', k: 'ok', items: ['Resource hears about critical events', 'Access token rejected within minutes', 'Location policies re-evaluated at the resource'] },
               'Why "disable and revoke" is immediate at Exchange Online and Graph but not at every app.'),
      terms: [['Revoke sign-in sessions', 'An action that invalidates a user’s refresh tokens and session cookies.'],
              ['Continuous access evaluation', 'A mechanism by which supporting resources reject tokens after critical events or location changes.'],
              ['Sign-in frequency', 'A Conditional Access session control that forces reauthentication after a set interval or every time.']] }
  ]
});

LEARN.push({
  id: 'L3', title: 'Hybrid Identity: How an On-Premises User Signs In', short: 'Hybrid sign-in', mins: 20,
  summary: 'The two separate decisions in hybrid identity - how objects reach the cloud and where passwords are checked - and the on-premises protocols (Kerberos, NTLM, federation) the exam expects you to recognise.',
  ms: [MSD("Implement and manage hybrid identity", "https://learn.microsoft.com/en-us/training/modules/implement-manage-hybrid-identity/"), MSD('What is hybrid identity?', 'https://learn.microsoft.com/entra/identity/hybrid/whatis-hybrid-identity'), MSD('Choose the right authentication method', 'https://learn.microsoft.com/entra/identity/hybrid/connect/choose-ad-authn')],
  mods: ['01-04', '02-01'],
  units: [
    { t: 'Two decisions, not one',
      body: '<p>Hybrid identity always involves two choices that are easy to blur. <strong>Synchronization</strong> decides how users, groups and (optionally) devices get from Active Directory into Entra: Entra Connect Sync or Cloud Sync. <strong>Authentication</strong> decides where the password is checked when a synced user signs in: in the cloud against a synced hash, on-premises through pass-through agents, or at a federation server.</p>' +
        '<p>Every combination is possible, and each exam scenario usually constrains exactly one of them - an outage requirement points at authentication, a disconnected forest at synchronization.</p>',
      vis: vVs({ t: 'How objects arrive', k: 'd1', items: ['Entra Connect Sync (full engine, device sync, PTA)', 'Entra Cloud Sync (agents, disconnected forests)'] },
               { t: 'Where passwords are checked', k: 'd2', items: ['Password hash sync (cloud)', 'Pass-through authentication (on-premises agents)', 'Federation (AD FS or another IdP)'] },
               'Pick one from each column.'),
      terms: [['Hybrid identity', 'A single identity for users across on-premises Active Directory and Microsoft Entra ID.'],
              ['Entra Connect Sync', 'The full synchronization engine installed on a Windows server; supports device sync and PTA.'],
              ['Entra Cloud Sync', 'A lightweight, agent-based synchronization service configured in the cloud.'],
              ['Staging mode', 'A Connect Sync server that imports and synchronizes but does not export; a warm standby.']] },
    { t: 'Kerberos and NTLM in one page',
      body: '<p>On-premises, Windows authenticates with <strong>Kerberos</strong>: the user gets a ticket-granting ticket (TGT) from a domain controller, then service tickets for each server, all encrypted with keys derived from account passwords. <strong>NTLM</strong> is the older challenge-response fallback. Neither crosses the internet, which is why cloud sign-in needs other protocols - and why features such as Seamless SSO and Entra Kerberos exist to bridge the two.</p>' +
        '<p><strong>Seamless SSO</strong> lets a domain-joined PC present a Kerberos ticket for a special computer account to Entra. <strong>Entra Kerberos</strong> goes the other way: Entra issues a partial TGT for your AD realm, so a cloud sign-in (Windows Hello for Business, passkeys) can reach on-premises resources.</p>',
      vis: vFlow([
        { t: 'User', s: 'signs in to Windows', k: 'd1' },
        { t: 'Domain controller', s: 'issues a TGT', k: 'd1' },
        { t: 'Service ticket', s: 'per server or service', k: 'acc' },
        { t: 'File server, IIS...', s: 'validates the ticket', k: 'ok' }
      ], 'Kerberos in four steps. Entra Kerberos replaces step 2 with a partial TGT issued by the cloud.'),
      terms: [['Kerberos', 'The ticket-based authentication protocol used by Active Directory.'],
              ['TGT', 'Ticket-granting ticket: the Kerberos credential from which service tickets are obtained.'],
              ['NTLM', 'An older challenge-response Windows authentication protocol.'],
              ['Seamless SSO', 'Silent sign-in to Entra for domain-joined devices using a Kerberos ticket for the AZUREADSSOACC account.'],
              ['Microsoft Entra Kerberos', 'Entra’s ability to issue partial Kerberos TGTs for an AD domain, enabling cloud credentials to reach on-premises resources.']] },
    { t: 'Federation and why it is being retired',
      body: '<p>With federation, Entra redirects the user to another identity provider - usually AD FS - which authenticates them against AD and returns a <strong>signed token</strong>. Entra trusts anything signed with that IdP’s token-signing key. That trust is the weakness: whoever holds the key can mint a token for any user on the domain, without a password and without a sign-in at your IdP.</p>' +
        '<p>Moving to password hash sync or PTA removes the AD FS servers, the certificates and the key. The migration path - application activity report, staged rollout, domain conversion - is an exam objective in its own right.</p>',
      vis: vFlow([
        { t: 'User', s: 'goes to Microsoft 365', k: 'd1' },
        { t: 'Entra ID', s: 'domain is federated: redirect', k: 'd2' },
        { t: 'AD FS', s: 'authenticates, signs token', k: 'warn' },
        { t: 'Entra ID', s: 'trusts the signature, issues tokens', k: 'd2' }
      ], 'The signature in step 3 is the whole trust.'),
      terms: [['Federation', 'Delegating authentication for a domain to an external identity provider.'],
              ['Token-signing certificate', 'The key a federation server uses to sign tokens; its compromise allows forged sign-ins.'],
              ['Staged rollout', 'A feature that moves selected groups to cloud authentication while the domain remains federated.'],
              ['Managed domain', 'A domain whose users authenticate with Entra (PHS or PTA) rather than a federated IdP.']] },
    { t: 'Choosing the authentication method',
      body: '<p>Microsoft’s decision guidance is short. Start with <strong>password hash sync</strong>: least infrastructure, survives on-premises outages, enables leaked credential detection. Choose <strong>pass-through authentication</strong> when on-premises account policies must be enforced at the moment of sign-in. Keep <strong>federation</strong> only for requirements neither can meet, such as a third-party MFA server or smart card flow that has no cloud equivalent - and even then, enable PHS as a backup.</p>',
      vis: vBars([
        { l: 'PHS', v: 0.2, note: 'least', k: 'd2' },
        { l: 'PTA', v: 0.55, note: 'agents' },
        { l: 'Federation', v: 0.95, note: 'most', k: 'warn' }
      ], 'On-premises infrastructure each method depends on, roughly. More infrastructure means more to patch, more to fail, more to steal.'),
      terms: [['Password hash synchronization', 'Syncing a hash of the AD password hash so Entra can authenticate users in the cloud.'],
              ['Pass-through authentication', 'Validating cloud sign-ins against AD in real time through on-premises agents.'],
              ['Leaked credentials detection', 'An ID Protection detection comparing user password hashes with credentials found in breaches; needs PHS.']] }
  ]
});

LEARN.push({
  id: 'L4', title: 'Zero Trust and the Conditional Access Decision', short: 'The access decision', mins: 20,
  summary: 'How Entra decides whether to issue a token: the signals it collects, how every applicable policy is combined, what risk adds, and where Global Secure Access and session controls extend the decision past sign-in.',
  ms: [MSD("Plan, implement, and administer Conditional Access", "https://learn.microsoft.com/en-us/training/modules/plan-implement-administer-conditional-access/"), MSD("Manage Microsoft Entra Identity Protection", "https://learn.microsoft.com/en-us/training/modules/manage-azure-active-directory-identity-protection/"), MSD('What is Conditional Access?', 'https://learn.microsoft.com/entra/identity/conditional-access/overview'), MSD('Zero Trust: secure identity', 'https://learn.microsoft.com/security/zero-trust/deploy/identity')],
  mods: ['02-02', '02-03', '02-04', '02-05'],
  units: [
    { t: 'Zero Trust in three sentences',
      body: '<p><strong>Verify explicitly</strong>: decide every access with all available signals, not network location alone. <strong>Use least privilege</strong>: just enough access, just in time. <strong>Assume breach</strong>: limit blast radius, segment, and watch everything. Conditional Access is where the first principle is enforced for identity; PIM and entitlement management carry the second; logs and ID Protection the third.</p>',
      vis: vCards([
        { t: 'Verify explicitly', s: 'Conditional Access, authentication strengths, device compliance, risk', k: 'd2' },
        { t: 'Least privilege', s: 'PIM, access packages, access reviews, scoped roles', k: 'd4' },
        { t: 'Assume breach', s: 'CAE, token protection, logs, ID Protection', k: 'warn' }
      ], 'Where each SC-300 feature sits in Microsoft’s Zero Trust model.'),
      terms: [['Zero Trust', 'A security model that verifies every request explicitly, grants least privilege and assumes breach.'],
              ['Verify explicitly', 'Deciding access on identity, device, location, risk and other signals for every request.'],
              ['Assume breach', 'Designing controls on the premise that an attacker is already present.']] },
    { t: 'Signals, decision, enforcement',
      body: '<p>After the first factor, Entra gathers signals - who the user is and their groups and roles, which app, which network, which device and its compliance, which client, how risky the sign-in and user are - and evaluates every enabled Conditional Access policy against them. Policies whose assignments match all <em>apply</em>; the rest do not. The decision is then enforced: block, grant with requirements, or grant with session controls.</p>',
      vis: vFlow([
        { t: 'Signals', s: 'user, app, network, device, client, risk', k: 'd1' },
        { t: 'Policies that apply', s: 'all assignments match, not excluded', k: 'd2' },
        { t: 'Combine', s: 'block wins; all grants required', k: 'acc' },
        { t: 'Enforce', s: 'block, prompt, or issue token with session rules', k: 'ok' }
      ], 'The same four steps run for every sign-in to every app that uses Entra ID.'),
      terms: [['Conditional Access', 'Entra’s policy engine that decides, per sign-in, whether and how to issue a token.'],
              ['Assignment', 'The users, target resources, network and conditions a policy applies to.'],
              ['Grant control', 'What a user must satisfy to get access, such as MFA or a compliant device; or block.'],
              ['Session control', 'What applies after access is granted, such as sign-in frequency or app enforced restrictions.'],
              ['Report-only mode', 'A policy state that evaluates and logs the outcome without enforcing it.']] },
    { t: 'Combining policies',
      body: '<p>Three rules settle almost every combination question. <strong>All applicable policies are enforced together</strong>: if one requires MFA and another a compliant device, the user needs both. <strong>Block wins</strong> over any grant. <strong>Exclusions win</strong> over inclusions, for users, apps and networks alike. Within one policy, <em>require all</em> is AND and <em>require one</em> is OR.</p>',
      vis: vAnat([
        { l: 'Rule 1', t: 'Every applicable policy applies; their grant requirements add up', k: 'd2' },
        { l: 'Rule 2', t: 'Any applicable block policy blocks, whatever else applies', k: 'warn' },
        { l: 'Rule 3', t: 'An exclusion removes the policy for that user, app or network', k: 'acc' },
        { l: 'Rule 4', t: 'Report-only policies never enforce', k: 'd1' }
      ], 'Try them in the evaluator in module 02-02.', 'Four rules'),
      terms: [['Authentication strength', 'A grant control that specifies which combinations of methods satisfy it, such as phishing-resistant MFA.'],
              ['Named location', 'An IP range or country set used in the network assignment; can be marked trusted.'],
              ['Filter for devices', 'A condition matching device properties such as trustType, isCompliant or extension attributes.']] },
    { t: 'Risk and the network edge',
      body: '<p><strong>ID Protection</strong> contributes two signals: sign-in risk (this request is probably not the owner) and user risk (this account is probably compromised). Risk-based policies turn them into requirements - MFA for risky sign-ins, a secure password change for risky users - so users can remediate themselves.</p>' +
        '<p><strong>Global Secure Access</strong> extends the decision to the network: Conditional Access can require that traffic arrives through your security service edge (the compliant network condition), and it applies web filtering profiles as a session control. Access decisions then follow the traffic, not just the sign-in.</p>',
      vis: vFlow([
        { t: 'ID Protection', s: 'sign-in risk, user risk', k: 'warn' },
        { t: 'Conditional Access', s: 'risk and network as conditions', k: 'd2' },
        { t: 'Global Secure Access', s: 'compliant network, web filtering', k: 'd2' },
        { t: 'CAE at the resource', s: 're-evaluate on events and IP change', k: 'ok' }
      ], 'Signals feed the decision; enforcement continues past it.'),
      terms: [['Sign-in risk', 'The probability that a specific authentication request was not made by the account owner.'],
              ['User risk', 'The probability that an account is compromised, aggregated over time.'],
              ['Self-remediation', 'A user satisfying a risk-based policy (MFA or secure password change) to close their own risk.'],
              ['Compliant network', 'A Conditional Access network condition satisfied only by traffic through the tenant’s Global Secure Access.']] }
  ]
});

LEARN.push({
  id: 'L5', title: 'Application Identity: Registrations, Service Principals and Consent', short: 'Application identity', mins: 20,
  summary: 'Why applications have two objects, how permissions are requested, consented and granted, and which kind of identity a workload should use.',
  ms: [MSD("Implement app registration", "https://learn.microsoft.com/en-us/training/modules/implement-app-registration/"), MSD("Register apps using Microsoft Entra ID", "https://learn.microsoft.com/en-us/training/modules/register-apps-use-microsoft-entra-id/"), MSD('Application and service principal objects', 'https://learn.microsoft.com/entra/identity-platform/app-objects-and-service-principals'), MSD('Permissions and consent', 'https://learn.microsoft.com/entra/identity-platform/permissions-consent-overview'), MSD('Workload identities', 'https://learn.microsoft.com/entra/workload-id/workload-identities-overview')],
  mods: ['03-01', '03-02', '03-03', '03-04'],

      body: '<p>Every identity is created, changes role, and leaves. Governance problems come from the middle and the end: movers keep old access, leavers keep accounts, guests outstay their project. Entra ID Governance addresses each stage: provisioning and dynamic groups for joiners, access packages with expiry and reviews for movers, and deprovisioning, external-user lifecycle settings and inactive-user reviews for leavers.</p>',

  function renderGlossary() {

      '<div class="gl__bar"><input class="gl__q" id="glq" type="search" placeholder="Filter terms and definitions" autocomplete="off">' +
      '<label class="xs__timed"><input type="checkbox" id="glflash"> Flashcards: hide definitions until clicked</label></div><div class="gl" id="gl">';

      h += '<details class="gl__t" open data-text="' + escH((g.term + ' ' + g.def).toLowerCase()) + '"><summary><strong>' + g.term + '</strong><span class="gl__src">' + g.L.id + ' &middot; ' + g.L.short + '</span></summary>' +

  function filterGlossary() {
    var q = ($('#glq').value || '').toLowerCase().trim();
    $$('#gl .gl__t').forEach(function (d) { d.hidden = !!q && d.dataset.text.indexOf(q) === -1; });
    $$('#gl .gl__letter').forEach(function (hd) {
      var el = hd.nextElementSibling, any = false;
      while (el && !el.classList.contains('gl__letter')) { if (!el.hidden) any = true; el = el.nextElementSibling; }
      hd.hidden = !any;

  /* ---------------- practice exam ---------------- */
  var XQ = {}; EXAMQ.forEach(function (q) { XQ[q.id] = q; });
  var MODE = { full: 'Full exam', missed: 'Missed questions' };
  SCORED.forEach(function (d) { MODE['d' + (+d)] = 'Domain ' + (+d) + ' only'; });
  var TYPE_NAME = { single: 'Multiple choice', multi: 'Multiple response', yesno: 'Yes / No set', code: 'Code completion', order: 'Build a list (ordering)' };
  var examTimer = null;
  function qDom(q) { return byId(q.mod).domain; }
  function hashStr(s) { var h = 7; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }
  function scramble(n, seed) {
    var p = [], h = hashStr(seed), i;
    for (i = 0; i < n; i++) p.push(i);
    for (i = n - 1; i > 0; i--) { h = (h * 1103515245 + 12345) >>> 0; var k = h % (i + 1), t = p[i]; p[i] = p[k]; p[k] = t; }
    if (p.every(function (v, j) { return v === j; })) p.reverse();
    return p;
  }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function ids(list) { return list.map(function (q) { return q.id; }); }
  function initAns(q) {
    if (q.type === 'multi') return [];
    if (q.type === 'yesno') return q.s.map(function () { return null; });
    if (q.type === 'code') return q.blanks.map(function () { return null; });
    if (q.type === 'order') return scramble(q.items.length, q.id);
    return null;
  }
  function isAnswered(q, a) {
    if (q.type === 'single') return a !== null && a !== undefined;
    if (q.type === 'multi') return !!a && a.length > 0;
    if (q.type === 'order') return true;
    return !!a && a.every(function (x) { return x !== null; });
  }
  function scoreQ(q, a) {
    if (q.type === 'single') return a === q.a ? 1 : 0;
    if (q.type === 'multi') return (a || []).slice().sort().join(',') === q.a.slice().sort().join(',') ? 1 : 0;
    if (q.type === 'yesno') return q.a.filter(function (v, i) { return a && a[i] === v; }).length / q.a.length;
    if (q.type === 'code') return q.blanks.filter(function (b, i) { return a && a[i] === b.a; }).length / q.blanks.length;
    if (q.type === 'order') return a && a.every(function (v, i) { return v === i; }) ? 1 : 0;
    return 0;
  }
  function wrongParts(q, a) {
    if (q.type === 'yesno' || q.type === 'code') {
      var out = [], n = q.type === 'yesno' ? q.a.length : q.blanks.length;
      for (var i = 0; i < n; i++) {
        var ok = q.type === 'yesno' ? (a && a[i] === q.a[i]) : (a && a[i] === q.blanks[i].a);
        if (!ok) out.push(q.pm ? q.pm[i] : [q.mod, q.obj]);
      }
      return out;
    }
    return scoreQ(q, a) === 1 ? [] : [[q.mod, q.obj]];
  }
  function instr(q) {
    return q.type === 'single' ? 'Choose one.' :
      q.type === 'multi' ? 'Choose ' + ['', 'one', 'two', 'three'][q.pick] + '. Each correct selection presents part of the solution.' :
      q.type === 'yesno' ? 'For each statement, select Yes if the statement is true. Otherwise, select No.' :
      q.type === 'code' ? 'Select the correct option for each blank in the code.' :
      'Move the items into the correct order.';
  }
  function fmtDate(t) { var d = new Date(t); return d.toISOString().slice(0, 10) + ' ' + d.toTimeString().slice(0, 5); }
  function fmtDur(s) { return Math.floor(s / 60) + ' min ' + (s % 60) + ' s'; }

  function startExam(mode) {
    var base = EXAMQ.filter(function (q) { return !q.case; }), cases = EXAMQ.filter(function (q) { return q.case; }), list;
    if (/^d\d$/.test(mode)) list = ids(shuffle(base.filter(function (q) { return qDom(q) === '0' + mode.slice(1); })));
    else if (mode === 'missed') {
      var last = state.exam.hist[0], wrong = last ? last.ids.filter(function (id) { return last.scores[id] < 1 && XQ[id]; }) : [];
      list = shuffle(wrong.filter(function (id) { return !XQ[id].case; })).concat(wrong.filter(function (id) { return XQ[id].case; }));
    } else list = ids(shuffle(base)).concat(ids(cases));
    if (!list.length) return;
    var answers = {};
    list.forEach(function (id) { answers[id] = initAns(XQ[id]); });
    var tm = $('#xtimed');
    state.exam.cur = { mode: mode, ids: list, answers: answers, flags: {}, idx: 0, started: Date.now(), timed: !!(tm && tm.checked) };
    save();
    go('#/exam');
  }
  function submitExam() {
    var c = state.exam.cur, scores = {}, byD = {}, wrongObjs = {}, total = 0;
    ORDER.forEach(function (d) { byD[d] = [0, 0]; });
    c.ids.forEach(function (id) {
      var q = XQ[id], a = c.answers[id], s = scoreQ(q, a), d = qDom(q);
      scores[id] = s; total += s; byD[d][0] += s; byD[d][1] += 1;
      wrongParts(q, a).forEach(function (p) {
        var k = p[0] + ':' + p[1];
        wrongObjs[k] = (wrongObjs[k] || 0) + 1;
        if (p[1] >= 0) state.misses[k] = (state.misses[k] || 0) + 1;
      });
    });
    state.exam.hist.unshift({ at: Date.now(), mode: c.mode, ids: c.ids, answers: c.answers, scores: scores,
      pct: Math.round(100 * total / c.ids.length), byD: byD, wrongObjs: wrongObjs, secs: Math.round((Date.now() - c.started) / 1000) });
    state.exam.hist = state.exam.hist.slice(0, 8);
    state.exam.cur = null;
    save();
    go('#/exam/review');
  }

  function answerUI(q, a, lock) {
    var dis = lock ? ' disabled' : '';
    if (q.type === 'single' || q.type === 'multi') {
      var multi = q.type === 'multi';
      return '<div class="xq__opts">' + q.o.map(function (o, i) {
        var on = multi ? (a || []).indexOf(i) !== -1 : a === i, mark = '';
        if (lock) { var right = multi ? q.a.indexOf(i) !== -1 : q.a === i; mark = right ? ' data-mark="right"' : (on ? ' data-mark="wrong"' : ''); }
        return '<label class="quiz__opt"' + mark + '><input type="' + (multi ? 'checkbox' : 'radio') + '" name="xopt" data-x="' + q.type + '" value="' + i + '"' + (on ? ' checked' : '') + dis + '><span>' + o + '</span></label>';
      }).join('') + '</div>';
    }
    if (q.type === 'yesno') {
      return '<div class="table-scroll"><table class="xq__yn"><thead><tr><th>Statement</th><th>Yes</th><th>No</th>' + (lock ? '<th>Key</th>' : '') + '</tr></thead><tbody>' +
        q.s.map(function (st, i) {
          var v = a ? a[i] : null;
          function cell(val) { return '<td class="xq__ync"><input type="radio" name="yn' + i + '" data-x="yesno" data-i="' + i + '" value="' + (val ? 1 : 0) + '"' + (v === val ? ' checked' : '') + dis + ' aria-label="' + (val ? 'Yes' : 'No') + '"></td>'; }
          return '<tr' + (lock ? ' data-ok="' + (v === q.a[i]) + '"' : '') + '><td>' + st + '</td>' + cell(true) + cell(false) + (lock ? '<td class="xq__key">' + (q.a[i] ? 'Yes' : 'No') + '</td>' : '') + '</tr>';
        }).join('') + '</tbody></table></div>';
    }
    if (q.type === 'code') {
      var out = '';
      q.code.split(/\[\[(\d+)\]\]/).forEach(function (p, i) {
        if (i % 2 === 0) { out += escH(p); return; }
        var k = +p, b = q.blanks[k], v = a ? a[k] : null;
        if (lock) {
          var ok = v === b.a;
          out += '<span class="xq__blank" data-ok="' + ok + '">' + escH(v === null || v === undefined ? '(blank)' : b.o[v]) + '</span>' + (ok ? '' : '<span class="xq__fix"> &rarr; ' + escH(b.o[b.a]) + '</span>');
        } else {
          out += '<select class="xq__sel" data-x="code" data-i="' + k + '" aria-label="Blank ' + (k + 1) + '"><option value="">&mdash; select &mdash;</option>' +
            b.o.map(function (o, oi) { return '<option value="' + oi + '"' + (v === oi ? ' selected' : '') + '>' + escH(o) + '</option>'; }).join('') + '</select>';
        }
      });
      return '<pre class="xq__code"><code>' + out + '</code></pre>';
    }
    if (q.type === 'order') {
      var perm = a || q.items.map(function (_, i) { return i; });
      if (lock) {
        return '<div class="xq__ord2"><div><h4>Your order</h4><ol>' + perm.map(function (ix, pos) { return '<li data-ok="' + (ix === pos) + '">' + q.items[ix] + '</li>'; }).join('') +
          '</ol></div><div><h4>Correct order</h4><ol>' + q.items.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ol></div></div>';
      }
      return '<ol class="xq__order">' + perm.map(function (ix, pos) {
        return '<li><span>' + q.items[ix] + '</span><span class="xq__mv">' +
          '<button class="btn" type="button" data-act="xmove" data-i="' + pos + '" data-d="-1" aria-label="Move up"' + (pos === 0 ? ' disabled' : '') + '>&uarr;</button>' +
          '<button class="btn" type="button" data-act="xmove" data-i="' + pos + '" data-d="1" aria-label="Move down"' + (pos === perm.length - 1 ? ' disabled' : '') + '>&darr;</button></span></li>';
      }).join('') + '</ol>';
    }
    return '';
  }

  function examCounts(c) {
    return {
      ans: c.ids.filter(function (x) { return isAnswered(XQ[x], c.answers[x]); }).length,
      flag: c.ids.filter(function (x) { return c.flags[x]; }).length

  }
  function refreshExamStrip() {
    var c = state.exam.cur, el = $('#xstat');

    el.textContent = 'Question ' + (c.idx + 1) + ' of ' + c.ids.length + ' \u00b7 ' + k.ans + ' answered' + (k.flag ? ' \u00b7 ' + k.flag + ' flagged' : '');
    var bar = $('#xbar'); if (bar) bar.style.width = pct(k.ans / c.ids.length) + '%';
    var cell = $('.xq__cell[data-i="' + c.idx + '"]'); if (cell) cell.dataset.done = String(isAnswered(XQ[c.ids[c.idx]], c.answers[c.ids[c.idx]]));
  }
  function startTimer() {

      var rem = c.ids.length * 60 - Math.round((Date.now() - c.started) / 1000), neg = rem < 0, r = Math.abs(rem);
      el.textContent = (neg ? '-' : '') + Math.floor(r / 60) + ':' + ('0' + (r % 60)).slice(-2) + (neg ? ' over' : ' left');

  }

  function renderExamStart() {
