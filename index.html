/* ======================================================================
   03-01  Identities for applications and Azure workloads
   ====================================================================== */
MODULES.push({
  id: '03-01', domain: '03', title: 'Choosing Workload Identities and Using Managed Identities', short: 'Managed Identities',
  group: 'Plan and implement identities for applications and Azure workloads',
  objectives: [
    'Select appropriate identities for applications and Azure workloads, including managed identities, service principals, user accounts, and managed service accounts',
    'Create managed identities',
    'Assign a managed identity to an Azure resource',
    'Use a managed identity assigned to an Azure resource to access other Azure resources'
  ],
  status: 'GA', verified: '',
  cost: { level: 'low', label: 'Low', est: 'Pennies: one storage account and a few transactions. Reuses sync01 from 01-04 as the compute, or a B1s Linux VM at about US$0.01 an hour.', meter: 'storage · transactions' },
  portal: 'Azure portal &gt; Managed Identities · resource &gt; Identity · resource &gt; Access control (IAM) · Entra admin center &gt; Entra ID &gt; Enterprise apps (application type: Managed Identities)',
  ms: [{ t: "Implement access management for Azure resources", u: "https://learn.microsoft.com/en-us/training/modules/implement-access-management-for-azure-resources/" }],
  sdk: '<code>Az.ManagedServiceIdentity</code> <code>Az.Resources</code> <code>az identity</code>',
  kql: '<code>AADManagedIdentitySignInLogs</code> <code>AADServicePrincipalSignInLogs</code> <code>AzureActivity</code>',
  prereq: ['00-01', '01-04'],
  tactical: 'A managed identity’s token is available to anything that can run code on the resource: one HTTP call to the instance metadata endpoint. An attacker with Virtual Machine Contributor can use Run Command or an extension to execute that call and walk away with a token for whatever the identity can reach - the pivot security researchers describe as the standard Azure lateral movement. In an investigation, <code>AADManagedIdentitySignInLogs</code> shows which resource each identity requested tokens for; <code>AzureActivity</code> shows who ran commands on the host. Keep managed identity role assignments as narrow as any admin’s.',
  body: function () { return '' +
    S('concept', 'Why this exists',
      '<p>Code needs an identity to call APIs. The question is always which kind, and the answer turns on <strong>where the code runs</strong> and <strong>who manages the credential</strong>.</p>' +
      T('compare', ['Identity', 'Use when', 'Credential', 'Avoid when'], [
        ['<strong>Managed identity</strong>', 'Code runs on an Azure resource that supports it (VM, App Service, Functions, Logic Apps, AKS, Automation...)', 'None you can see: Azure rotates it', 'Code runs outside Azure'],
        ['<strong>Service principal</strong> (app registration)', 'Code runs outside Azure, in CI/CD, on-premises, or is a multitenant app', 'Certificate or <strong>federated credential</strong>; secret only if nothing else works', 'A managed identity would do'],
        ['<strong>User account</strong>', 'A human acting interactively', 'Password, MFA', 'Automation: it breaks on MFA and leaves with the employee'],
        ['<strong>gMSA / dMSA / sMSA</strong>', 'Windows services and scheduled tasks on-premises', 'AD manages and rotates the password', 'Anything cloud-hosted']
      ]) +
      '<p><strong>Workload identity federation</strong> closes the gap for code outside Azure: a GitHub Actions workflow, a Kubernetes pod or another cloud presents its own OIDC token, and Entra exchanges it for an access token for your app registration or user-assigned managed identity. No secret exists to leak.</p>' +
      Q('note', '<strong>On-premises managed service accounts.</strong> A <strong>gMSA</strong> works across several servers; an <strong>sMSA</strong> is tied to one; a <strong>dMSA</strong> (Windows Server 2025) replaces an existing service account and disables its old password. All three have passwords AD generates and rotates, so no human knows them.')) +
    S('mechanism', 'How it works under the hood',
      T('compare', ['', 'System-assigned', 'User-assigned'], [
        ['Lifecycle', 'Created with the resource, deleted with it', 'A standalone Azure resource with its own lifecycle'],
        ['Sharing', 'One resource only', 'Many resources can share one identity'],
        ['Pre-authorisation', 'Role assignments only after the resource exists', 'Assign roles before deploying the resource'],
        ['Good for', 'A single resource that needs its own identity', 'Scale sets, blue/green deployments, federated credentials']
      ]) +
      '<p>Either way the identity is a <strong>service principal</strong> of type <em>ManagedIdentity</em> in Entra. You cannot sign in as it, add credentials to it or grant it consent in the portal. It gets Azure access through <strong>Azure RBAC role assignments</strong> and Entra or Graph access through <strong>app role assignments</strong> made with PowerShell or Graph - there is no portal button for that.</p>' +
      C('bash', String.raw`
RG=rg-sc300-mi
az group create -n $RG -l canadacentral

# User-assigned identity (a resource in its own right)
az identity create -g $RG -n id-sc300-reader

# System-assigned identity on an existing VM, and attaching the user-assigned one
az vm identity assign -g rg-sc300-hybrid -n sync01
az vm identity assign -g rg-sc300-hybrid -n sync01 --identities $(az identity show -g $RG -n id-sc300-reader --query id -o tsv)

# Let the system-assigned identity read blobs in one storage account
SA=stsc300mi$RANDOM
az storage account create -g $RG -n $SA --sku Standard_LRS --allow-shared-key-access false
PRINCIPAL=$(az vm show -g rg-sc300-hybrid -n sync01 --query identity.principalId -o tsv)
az role assignment create --assignee-object-id $PRINCIPAL --assignee-principal-type ServicePrincipal \
    --role "Storage Blob Data Reader" --scope $(az storage account show -g $RG -n $SA --query id -o tsv)`) +
      '<p>Inside the resource, code asks the local endpoint for a token. On a VM that is the <strong>Instance Metadata Service</strong> at <code>169.254.169.254</code>, which answers only requests carrying the <code>Metadata: true</code> header; App Service and Functions expose <code>IDENTITY_ENDPOINT</code> and <code>IDENTITY_HEADER</code> instead. SDKs hide all of this behind <code>DefaultAzureCredential</code> or <code>ManagedIdentityCredential</code>.</p>' +
      C('powershell', String.raw`
# On sync01: get a token for Azure Storage from IMDS, then list blobs with it
$t = Invoke-RestMethod -Headers @{ Metadata = 'true' } -Uri 'http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://storage.azure.com/'
$h = @{ Authorization = "Bearer $($t.access_token)"; 'x-ms-version' = '2021-08-06' }
Invoke-RestMethod -Headers $h -Uri "https://$sa.blob.core.windows.net/lab?restype=container&comp=list"

# For the user-assigned identity, add &client_id=<its client ID> to the IMDS URI`) +
      C('powershell', String.raw`
# Grant a managed identity a Microsoft Graph application permission (no portal UI exists for this)
$graph = Get-MgServicePrincipal -Filter "appId eq '00000003-0000-0000-c000-000000000000'"
$role  = $graph.AppRoles | Where-Object Value -eq 'User.Read.All'
$mi    = Get-MgServicePrincipal -Filter "displayName eq 'id-sc300-reader'"
New-MgServicePrincipalAppRoleAssignment -ServicePrincipalId $mi.Id -PrincipalId $mi.Id -ResourceId $graph.Id -AppRoleId $role.Id`)) +
    S('config', 'Configuration surface',
      T('config', ['Control', 'Default', 'Set it to', 'Why'], [
        ['Identity type', '-', 'System-assigned for one resource; user-assigned when shared or pre-authorised', 'Lifecycle should match the workload'],
        ['Role assignment scope', 'Whatever was clicked', 'The single resource, never the subscription', 'Anyone with code execution inherits it'],
        ['Data-plane roles', '-', 'Storage Blob Data Reader, Key Vault Secrets User...', 'Contributor does not read data; Owner is far too much'],
        ['Storage shared key access', 'Enabled', 'Disabled', 'Forces Entra auth, so the identity is the only way in'],
        ['Service principal credentials', 'Secret, up to 24 months in the portal', 'Certificate or federated credential', 'Secrets are copied and leaked'],
        ['Service accounts on-premises', 'User accounts with fixed passwords', 'gMSA, or dMSA on Windows Server 2025', 'Kerberoasting targets human-set passwords']
      ])) +
    S('failure', 'Common failure modes',
      '<p><strong>403 from storage although the identity is Owner.</strong> Owner and Contributor are control-plane roles. Reading blobs needs a data-plane role such as Storage Blob Data Reader.</p>' +
      '<p><strong>New role assignment not working yet.</strong> Assignments can take several minutes to propagate, and the token cached before the change does not carry it. Request a new token.</p>' +
      '<p><strong>Code picks the wrong identity.</strong> A resource with both system- and user-assigned identities needs the client ID in the token request for the user-assigned one.</p>' +
      '<p><strong>Access lost after redeploying.</strong> The system-assigned identity was deleted with the old resource and a new one, with a new principal ID and no roles, came with the new resource.</p>' +
      '<p><strong>Graph permissions on a managed identity not visible in the portal.</strong> They exist; they were granted with PowerShell. Look under the service principal’s <em>Permissions</em>.</p>') +
    S('exam', 'How this is tested',
      T('exam', ['Phrase in the question', 'What it steers you to'], [
        ['"an Azure Function must read Key Vault without storing credentials"', 'Managed identity + Key Vault data-plane role'],
        ['"several VMs in a scale set share one identity", "assign access before deployment"', 'User-assigned managed identity'],
        ['"identity must be deleted when the resource is deleted"', 'System-assigned managed identity'],
        ['"a GitHub Actions workflow deploys to Azure without secrets"', 'Workload identity federation (federated credential)'],
        ['"an on-premises app calls Microsoft Graph"', 'App registration / service principal with a certificate'],
        ['"a Windows service on several servers needs a domain account with an automatic password"', 'Group managed service account'],
        ['"minimise administrative effort for credential rotation"', 'Managed identity'],
        ['"grant a managed identity Microsoft Graph application permissions"', 'New-MgServicePrincipalAppRoleAssignment (no portal UI)']
      ])) +
    S('validation', 'Validation',
      C('kql', String.raw`
AADManagedIdentitySignInLogs
| where TimeGenerated > ago(1d)
| project TimeGenerated, ServicePrincipalName, ResourceDisplayName, IPAddress, ResultType
| order by TimeGenerated desc`) +
      C('kql', String.raw`
// Who ran code on a VM that holds a managed identity
AzureActivity
| where TimeGenerated > ago(7d)
| where OperationNameValue in~ ("MICROSOFT.COMPUTE/VIRTUALMACHINES/RUNCOMMAND/ACTION", "MICROSOFT.COMPUTE/VIRTUALMACHINES/EXTENSIONS/WRITE")
| project TimeGenerated, Caller, CallerIpAddress, _ResourceId, ActivityStatusValue`)) +
    S('sources', 'Sources', '<ul>' + LEARNLI(this) +
      '<li>' + L('What are managed identities for Azure resources?', 'https://learn.microsoft.com/entra/identity/managed-identities-azure-resources/overview') + '</li>' +
      '<li>' + L('Managed identity best practice recommendations', 'https://learn.microsoft.com/entra/identity/managed-identities-azure-resources/managed-identity-best-practice-recommendations') + '</li>' +
      '<li>' + L('Workload identity federation', 'https://learn.microsoft.com/entra/workload-id/workload-identity-federation') + '</li>' +
      '<li>' + L('Group Managed Service Accounts overview', 'https://learn.microsoft.com/windows-server/identity/ad-ds/manage/group-managed-service-accounts/group-managed-service-accounts/group-managed-service-accounts-overview') + '</li>' +
      '<li>' + L('Delegated Managed Service Accounts overview in Windows Server 2025', 'https://learn.microsoft.com/windows-server/identity/ad-ds/manage/delegated-managed-service-accounts/delegated-managed-service-accounts-overview') + '</li>' +
      '</ul>' + SRCSTAMP(this));
  },
  lab: {
    intro: 'Give sync01 a system-assigned identity, read a blob with it without any credential on disk, then attach a user-assigned identity and grant it a Graph permission the portal cannot grant.',
    steps: [
      '<p>Start sync01. Create the storage account from the module with <strong>shared key access disabled</strong>, a container named <code>lab</code> and one text blob.</p>',
      '<p>Enable the <strong>system-assigned</strong> identity on sync01 (portal: VM &gt; Identity, or <code>az vm identity assign</code>). Find the new service principal in <strong>Entra ID &gt; Enterprise apps</strong> with the application type filter <em>Managed Identities</em>.</p>',
      '<p>From sync01, request an IMDS token and list the container. Expect <strong>403</strong>: the identity has no role yet.</p>',
      '<p>Assign <strong>Storage Blob Data Reader</strong> on the storage account only. Wait a few minutes, request a <em>new</em> token, and list again.</p>',
      '<p>Create the user-assigned identity <code>id-sc300-reader</code>, attach it to sync01, and grant it <code>User.Read.All</code> on Microsoft Graph with the PowerShell in the module. Request a Graph token from IMDS with its <code>client_id</code> and call <code>https://graph.microsoft.com/v1.0/users?$top=3</code>.</p>',
      '<p>Find both identities’ token requests in <strong>Sign-in logs &gt; Managed identity sign-ins</strong>.</p>',
      '<p>Write down, for each of four scenarios, which identity you would choose and why: a Logic App calling Graph; a Jenkins server on-premises deploying to Azure; a GitHub Actions workflow deploying to Azure; an IIS app pool on three on-premises servers.</p>'
    ],
    teardown: [
      { bucket: '1', title: 'Resources', items: [
        'Delete the resource group: <code>az group delete -n rg-sc300-mi --yes</code> (removes the storage account and the user-assigned identity)',
        'Remove the Graph app role assignment first if you keep the identity' ] },
      { bucket: '2', title: 'VMs', items: [
        'Disable the system-assigned identity on sync01, then deallocate sync01' ] },
      { bucket: '3', title: 'Verify', items: [
        'No service principal named id-sc300-reader remains in Enterprise applications' ] }
    ]
  },
  quiz: [
    { q: 'A build pipeline running on an on-premises Jenkins server must deploy to Azure. Which identity is most appropriate?', o: ['A system-assigned managed identity', 'A service principal with a certificate or federated credential', 'A dedicated user account with MFA excluded', 'A gMSA'], a: 1, obj: 0,
      why: 'Managed identities only exist on Azure resources. Outside Azure, use a service principal with the strongest credential available; never a user account for automation.' },
    { q: 'A Windows service runs on four on-premises servers and needs a domain account whose password nobody knows and AD rotates. What do you use?', o: ['A user account with a long password', 'A group managed service account', 'A standalone managed service account', 'A managed identity'], a: 1, obj: 0,
      why: 'A gMSA can be used on several servers; an sMSA is limited to one.' },
    { q: 'Ten VMs in a scale set must share one identity, and its access must be granted before the VMs exist. What do you create?', o: ['A system-assigned managed identity on each VM', 'A user-assigned managed identity', 'An app registration with a secret', 'A service account'], a: 1, obj: 1,
      why: 'User-assigned identities are standalone resources that can be shared and pre-authorised.' },
    { q: 'An identity must be removed automatically when its App Service app is deleted. Which do you assign?', o: ['User-assigned managed identity', 'System-assigned managed identity', 'Federated credential', 'Service principal'], a: 1, obj: 2,
      why: 'A system-assigned identity shares the lifecycle of its resource.' },
    { q: 'A VM’s managed identity is Owner of a storage account, but reading blobs with its token returns 403. Why?', o: ['IMDS is disabled', 'Owner is a control-plane role; reading blob data needs a data-plane role such as Storage Blob Data Reader', 'Managed identities cannot access storage', 'The token audience must be Microsoft Graph'], a: 1, obj: 3,
      why: 'Blob data access with Entra auth requires a Storage Blob Data role; Owner and Contributor manage the account, not its data.' },
    { q: 'How does code on a VM obtain a token for its managed identity?', o: ['From a secret in an environment variable', 'By calling the Instance Metadata Service at 169.254.169.254 with the Metadata: true header', 'By signing in with the VM name', 'From Key Vault'], a: 1, obj: 3,
      why: 'IMDS issues managed identity tokens to code on the VM; the SDKs wrap this call.' }
  ]
});

/* ======================================================================
   03-02  Enterprise applications
   ====================================================================== */
MODULES.push({
  id: '03-02', domain: '03', title: 'Enterprise Applications, Application Proxy, SaaS SSO and Consent', short: 'Enterprise Apps',
  group: 'Plan, implement, and monitor the integration of enterprise applications',
  objectives: [
    'Plan and implement settings for enterprise applications, including application-level and tenant-level settings',
    'Assign appropriate Microsoft Entra roles to users to manage enterprise applications',
    'Design and implement integration for on-premises apps by using Microsoft Entra Application Proxy',
    'Design and implement integration for software as a service (SaaS) apps',
    'Assign, classify, and manage users, groups, and app roles for enterprise applications',
    'Configure and manage user and admin consent',
    'Create and manage application collections'
  ],
  status: 'GA', verified: '',
  cost: { level: 'mid', label: 'Medium', est: 'Uses sync01 from 01-04 as the private network connector host and web server, so the VM meter runs while you work. Application Proxy itself is included with P1.', meter: 'hourly · sync01' },
  portal: 'Entra admin center &gt; Entra ID &gt; Enterprise apps · Consent and permissions · App launchers · Application proxy · Admin consent requests',
  ms: [{ t: "Plan and design the integration of enterprise apps for SSO", u: "https://learn.microsoft.com/en-us/training/modules/plan-design-integration-of-enterprise-apps-for-sso/" }, { t: "Implement and monitor the integration of enterprise apps for SSO", u: "https://learn.microsoft.com/en-us/training/modules/implement-monitor-integration-of-enterprise-apps-for-sso/" }],
  sdk: '<code>Microsoft.Graph.Applications</code> <code>Microsoft.Graph.Identity.SignIns</code>',
  kql: '<code>AuditLogs</code> <code>SigninLogs</code> <code>AADServicePrincipalSignInLogs</code>',
  prereq: ['01-04', '02-02'],
  tactical: 'Illicit consent is account takeover without a password. A user who clicks <em>Accept</em> on a malicious app hands it a refresh token for their mail and files that survives password resets and MFA; an admin who grants tenant-wide consent hands it the organisation. The audit trail is <em>Consent to application</em> (check <code>ConsentType</code> and whether it was admin consent), <em>Add delegated permission grant</em> and <em>Add app role assignment to service principal</em>. Remediation is to disable the service principal, remove the grants and app role assignments, and revoke the affected users’ sessions - in that order, or the app keeps working until its token expires.',
  body: function () { return '' +
    S('concept', 'Why this exists',
      '<p>An <strong>enterprise application</strong> is a service principal: your tenant’s local instance of an application, whether you wrote it, bought it from the gallery, published it from on-premises or a user consented to it. Everything about <em>how that application is used in your tenant</em> - who may sign in, how SSO works, which permissions it holds, where users find it - is configured here. The application’s definition lives in its app registration (03-03), usually in someone else’s tenant.</p>' +
      T('compare', ['Level', 'Setting', 'Effect'], [
        ['Application', 'Enabled for users to sign in', 'No means nobody can get a token for it - the kill switch'],
        ['Application', 'Assignment required', 'Yes means only assigned users and groups can sign in'],
        ['Application', 'Visible to users', 'Shows or hides the tile in My Apps'],
        ['Application', 'Owners', 'Can manage SSO, provisioning and assignments for that app only'],
        ['Tenant', 'Consent and permissions: user consent settings', 'What users may consent to on their own'],
        ['Tenant', 'Admin consent requests', 'The workflow for everything they may not'],
        ['Tenant', 'Users can add gallery apps to My Apps', 'Self-service password-based SSO apps']
      ])) +
    S('mechanism', 'How it works under the hood',
      '<h3>Roles for managing applications</h3>' +
      T('compare', ['Role', 'Scope of power'], [
        ['Application Administrator', 'All app registrations and enterprise apps, <strong>including Application Proxy</strong>; can grant consent except Microsoft Graph application permissions'],
        ['Cloud Application Administrator', 'The same, <strong>without Application Proxy</strong>'],
        ['Application Developer', 'Register applications (even when user registration is off); becomes owner of what they create'],
        ['Privileged Role Administrator', 'Grants tenant-wide consent for any permission to any API, including Microsoft Graph app roles; Cloud Application, Application and AI Administrators can grant everything except Graph app roles. In the admin consent workflow, only Global Administrators approve Graph app role requests'],
        ['App owner', 'Full control of one app’s configuration and assignments'],
        ['Custom role', 'For example only <code>microsoft.directory/servicePrincipals/appRoleAssignedTo/update</code> to manage assignments']
      ]) +
      '<h3>Application Proxy</h3>' +
      '<p>Application Proxy publishes an internal <strong>web</strong> app at an external URL (<code>https://app-tenant.msappproxy.net</code> or a custom domain with your certificate). A <strong>private network connector</strong> on-premises holds an outbound connection to the service - no inbound firewall rules, no DMZ. With <strong>Microsoft Entra ID pre-authentication</strong> the user must sign in to Entra first, so Conditional Access applies before a single packet reaches your server; <strong>passthrough</strong> skips that and should be rare.</p>' +
      T('compare', ['Back-end authentication', 'SSO method'], [
        ['Windows Integrated Authentication', 'Kerberos constrained delegation: the connector’s computer account is trusted to delegate to the app’s SPN'],
        ['Header-based', 'Header-based SSO: Entra claims injected as HTTP headers'],
        ['Forms, own login page', 'Password-based SSO'],
        ['SAML on-premises', 'SAML SSO through the proxy']
      ]) +
      '<p>Use Application Proxy for browser-based web apps reached from any device without a client. Use Private Access (02-05) for anything non-HTTP (RDP, SMB, SSH) or when you want a VPN replacement. Both use the same connectors.</p>' +
      '<h3>SaaS apps</h3>' +
      '<p>Gallery apps come pre-configured for one or more SSO modes: <strong>SAML</strong>, <strong>OpenID Connect/OAuth</strong>, <strong>password-based</strong> or <strong>linked</strong>. For SAML you exchange configuration with the vendor:</p>' +
      T('config', ['Field', 'Meaning'], [
        ['Identifier (Entity ID)', 'Unique name of the SaaS app, from the vendor'],
        ['Reply URL (ACS URL)', 'Where Entra posts the SAML response'],
        ['Sign on URL', 'For SP-initiated sign-in from My Apps'],
        ['Attributes and claims', 'NameID format and source (UPN, mail, employeeid...) and extra claims'],
        ['SAML signing certificate', 'Valid three years by default; add a notification email, create the new one before expiry, upload it to the vendor, then make it active'],
        ['App Federation Metadata URL', 'Give this to the vendor instead of files where possible']
      ]) +
      '<p><strong>Automatic provisioning</strong> (SCIM) creates, updates and disables accounts in the SaaS app: you enter the tenant URL and secret token, map attributes, scope to <em>assigned users and groups</em>, and start the job; after the initial cycle, incremental cycles typically run every 20-40 minutes. <strong>Provision on demand</strong> tests one user; the <strong>provisioning logs</strong> record every action.</p>' +
      '<h3>Users, groups, app roles and classification</h3>' +
      '<p>Assign users or groups (group assignment needs P1, and <strong>nested groups are not expanded</strong>). If the app defines app roles, each assignment names a role, which arrives in the <code>roles</code> claim. To classify applications, tag them with custom security attributes and use the <em>filter for applications</em> condition in Conditional Access (02-02); to classify permissions, mark Microsoft Graph delegated permissions as <em>low impact</em> in <strong>Permission classifications</strong>, which the consent settings then use.</p>' +
      '<h3>Consent</h3>' +
      T('compare', ['User consent setting', 'Effect'], [
        ['Do not allow user consent', 'Every app needs an admin; pair with the admin consent workflow'],
        ['Allow user consent for apps from verified publishers, for selected permissions', 'Users consent only to low-impact classified permissions from verified publishers (and apps registered in your tenant)'],
        ['Let Microsoft manage your consent settings', 'Microsoft’s current recommended default, adjusted as threats change']
      ]) +
      '<p>The <strong>admin consent workflow</strong> lets users request an app they cannot consent to; designated reviewers approve or deny in <strong>Admin consent requests</strong>, and requests expire after the number of days you configure. Consent to delegated permissions creates <code>oauth2PermissionGrant</code> objects; consent to application permissions creates app role assignments.</p>' +
      C('powershell', String.raw`
# What an app can do in your tenant: delegated grants and application permissions
$sp = Get-MgServicePrincipal -Filter "displayName eq 'Suspicious Mail Helper'"
Get-MgOauth2PermissionGrant -Filter "clientId eq '$($sp.Id)'" | Select-Object ConsentType, PrincipalId, Scope
Get-MgServicePrincipalAppRoleAssignment -ServicePrincipalId $sp.Id | Select-Object ResourceDisplayName, AppRoleId

# Contain it: disable sign-in, then remove what it was granted
Update-MgServicePrincipal -ServicePrincipalId $sp.Id -AccountEnabled:$false
Get-MgOauth2PermissionGrant -Filter "clientId eq '$($sp.Id)'" | ForEach-Object { Remove-MgOauth2PermissionGrant -OAuth2PermissionGrantId $_.Id }
Get-MgServicePrincipalAppRoleAssignment -ServicePrincipalId $sp.Id | ForEach-Object { Remove-MgServicePrincipalAppRoleAssignment -ServicePrincipalId $sp.Id -AppRoleAssignmentId $_.Id }`) +
      '<h3>Collections</h3>' +
      '<p>Administrators group apps into named sections of <strong>My Apps</strong> for users or groups - for example <em>HR tools</em> for all employees. They are managed in the admin center under <strong>Entra ID &gt; Enterprise apps &gt; App launchers</strong> (formerly <em>Collections</em>); users can also create personal collections in My Apps. A collection only arranges apps users already have access to - it grants nothing.</p>') +
    S('config', 'Configuration surface',
      T('config', ['Control', 'Default', 'Set it to', 'Why'], [
        ['Assignment required', 'No for most apps', 'Yes for anything sensitive', 'Otherwise every user in the tenant can get a token'],
        ['User consent', 'Microsoft managed', 'Verified publishers, low-impact permissions only, or none', 'Consent phishing'],
        ['Admin consent workflow', 'Off', 'On, with named reviewers and 30-day expiry', 'Gives users a path that is not "ask IT on Teams"'],
        ['Application Proxy pre-authentication', 'Microsoft Entra ID', 'Keep it', 'Passthrough bypasses Conditional Access'],
        ['Connectors per group', '1', '2 or more', 'Redundancy during updates'],
        ['SAML certificate notification email', 'Admin who created it', 'A shared mailbox', 'The admin who set it up three years ago has left']
      ])) +
    S('failure', 'Common failure modes',
      '<p><strong>Users get AADSTS50105.</strong> Assignment is required and the user is not assigned - often because they are in a nested group.</p>' +
      '<p><strong>Application Proxy returns 500 with Kerberos SSO.</strong> The connector computer account is not trusted for delegation to the app’s SPN, or the SPN is wrong.</p>' +
      '<p><strong>Cloud Application Administrator cannot configure Application Proxy.</strong> That role deliberately excludes it; use Application Administrator.</p>' +
      '<p><strong>SAML SSO breaks on a date nobody remembered.</strong> The signing certificate expired.</p>' +
      '<p><strong>Admin approves a request but consent fails for Graph application permissions.</strong> Through the admin consent workflow, only a Global Administrator can approve requests for Microsoft Graph app roles; reviewers with other roles can view, block or deny them. Outside the workflow, a Privileged Role Administrator can grant that consent directly.</p>') +
    S('exam', 'How this is tested',
      T('exam', ['Phrase in the question', 'What it steers you to'], [
        ['"only members of Finance may sign in to the app"', 'Assignment required = Yes, assign the Finance group'],
        ['"hide the app from My Apps but keep it working"', 'Visible to users = No'],
        ['"manage all enterprise apps except Application Proxy"', 'Cloud Application Administrator'],
        ['"publish an internal IIS app with Windows auth, no inbound firewall ports"', 'Application Proxy + KCD SSO'],

        ['"automatically create and disable accounts in the SaaS app"', 'Automatic provisioning (SCIM)'],

        ['"users may consent only to low-risk permissions from verified publishers"', 'User consent setting + permission classifications'],
        ['"users request apps they cannot consent to"', 'Admin consent workflow'],
        ['"group HR apps together in My Apps for all employees"', 'Collections (App launchers)']

    S('validation', 'Validation',

AuditLogs

    S('sources', 'Sources', '<ul>' + LEARNLI(this) +

MODULES.push({
  id: '03-03', domain: '03', title: 'App Registrations: Authentication, API Permissions and App Roles', short: 'App Registrations',
  group: 'Plan and implement app registrations',
  objectives: [
    'Plan for app registrations',
    'Create app registrations',
    'Configure app authentication',
    'Configure API permissions',
    'Create app roles'
  ],
  status: 'GA', verified: '',
  cost: { level: 'none', label: '$0', est: '$0. Directory objects only.', meter: 'none' },
  portal: 'Entra admin center &gt; Entra ID &gt; App registrations · User settings (Users can register applications)',
  ms: [{ t: "Implement app registration", u: "https://learn.microsoft.com/en-us/training/modules/implement-app-registration/" }, { t: "Register apps using Microsoft Entra ID", u: "https://learn.microsoft.com/en-us/training/modules/register-apps-use-microsoft-entra-id/" }],
  sdk: '<code>Microsoft.Graph.Applications</code>',
  kql: '<code>AuditLogs</code> <code>AADServicePrincipalSignInLogs</code> <code>MicrosoftGraphActivityLogs</code>',
  prereq: ['00-01', '03-02'],
  tactical: 'Adding a credential to an application that already holds permissions is the quietest persistence in Entra: no new app, no new consent, just a new secret or certificate on something trusted. Microsoft’s January 2024 guidance on Midnight Blizzard describes the actor compromising a legacy test OAuth application that already held elevated access, creating more OAuth apps, and using the legacy app to grant itself the Exchange Online full_access_as_app role; one of the Defender for Cloud Apps detections it lists fires when an app’s EWS calls jump within days of a credential update. Alert on <em>Update application - Certificates and secrets management</em> and <em>Add service principal credentials</em>, then compare with <code>AADServicePrincipalSignInLogs</code>: a first-ever sign-in for an app from an IP it has never used, shortly after a credential was added, is the pattern.',
  body: function () { return '' +
    S('concept', 'Why this exists',
      '<p>An <strong>app registration</strong> is the global definition of an application: its identity (<em>application ID</em>, also called client ID), who may sign in to it, its redirect URIs, its credentials, the APIs it wants and the roles and scopes it exposes. It lives in one tenant - the home tenant. A <strong>service principal</strong> is the local instance of that definition in each tenant that uses it, and it is what gets permissions, assignments and Conditional Access.</p>' +
      T('compare', ['Supported account types', '<code>signInAudience</code>', 'Use'], [
        ['This organisational directory only', '<code>AzureADMyOrg</code>', 'Internal line-of-business apps'],
        ['Any organisational directory', '<code>AzureADMultipleOrgs</code>', 'SaaS for businesses'],
        ['Any organisational directory and personal Microsoft accounts', '<code>AzureADandPersonalMicrosoftAccount</code>', 'Broad consumer and business apps'],
        ['Personal Microsoft accounts only', '<code>PersonalMicrosoftAccount</code>', 'Consumer apps']
      ]) +
      '<p><strong>Planning</strong> covers who may register apps (by default every user can; restrict with <em>Users can register applications</em> = No and grant Application Developer to the few who should), ownership (at least two owners, never a departed employee), naming, the credential type, and which permissions the app will need before anyone asks for consent.</p>') +
    S('mechanism', 'How it works under the hood',
      '<h3>Authentication configuration</h3>' +
      T('config', ['Platform', 'Redirect URI', 'Flow'], [
        ['Web', 'Server-side URL, HTTPS', 'Authorization code; confidential client with a credential'],
        ['Single-page application', 'Browser URL', 'Authorization code with PKCE, no secret'],
        ['Mobile and desktop', '<code>msal{clientId}://auth</code> or loopback', 'Public client; PKCE'],
        ['None (daemon)', '-', 'Client credentials: the app’s own identity']
      ]) +
      '<p>Leave <strong>implicit grant</strong> (ID and access token checkboxes) off unless a legacy SPA requires it, and leave <strong>Allow public client flows</strong> off unless the app genuinely needs device code or resource-owner password flows. <strong>Token configuration</strong> adds optional claims and the <code>groups</code> claim - choose <em>groups assigned to the application</em> for large tenants to avoid overage.</p>' +
      T('compare', ['Credential', 'Verdict'], [
        ['Federated credential', 'Best: no secret exists (GitHub Actions, Kubernetes, another cloud, or a managed identity as the credential)'],
        ['Certificate', 'Good: the private key can live in a Key Vault or HSM'],
        ['Client secret', 'Last resort: portal maximum 24 months, and it ends up in config files']
      ]) +
      '<h3>API permissions</h3>' +
      T('compare', ['', 'Delegated permission (scope)', 'Application permission (app role)'], [
        ['Acts as', 'The signed-in user', 'The application itself, no user'],
        ['Effective access', 'Intersection of the permission and what the user can do', 'Everything the permission allows, tenant-wide'],
        ['Consent', 'User or admin, depending on the permission and consent settings', '<strong>Always admin consent</strong>'],
        ['Token claim', '<code>scp</code>', '<code>roles</code>'],
        ['Example', '<code>Mail.Read</code>: read the signed-in user’s mail', '<code>Mail.Read</code>: read every mailbox']
      ]) +
      '<p>The app registration only <em>requests</em> permissions (<code>requiredResourceAccess</code>). Nothing is granted until consent creates delegated grants or app role assignments on the service principal - which is why <strong>Grant admin consent for &lt;tenant&gt;</strong> is a separate button.</p>' +
      '<h3>Exposing an API and app roles</h3>' +
      '<p>An app that is itself an API sets an <strong>Application ID URI</strong> (<code>api://{clientId}</code> by default), defines <strong>scopes</strong> for delegated access and can <strong>pre-authorise</strong> its own client apps to skip consent. <strong>App roles</strong> have a display name, a <code>value</code> that appears in the <code>roles</code> claim, and <strong>allowed member types</strong>: <em>Users/Groups</em> (assigned in the enterprise app, 03-02), <em>Applications</em> (they appear to other apps as application permissions), or both.</p>' +
      C('powershell', String.raw`
$graphId = '00000003-0000-0000-c000-000000000000'
$app = New-MgApplication -DisplayName 'SC300 Expenses' -SignInAudience 'AzureADMyOrg' -Web @{ RedirectUris = @('https://localhost:5001/signin-oidc') } -RequiredResourceAccess @(
    @{ ResourceAppId = $graphId; ResourceAccess = @(
        @{ Id = 'e1fe6dd8-ba31-4d61-89e7-88639da4683d'; Type = 'Scope' }     # User.Read (delegated)
        @{ Id = 'df021288-bdef-4463-88db-98f22de89214'; Type = 'Role' } ) }  # User.Read.All (application)
) -AppRoles @(
    @{ Id = (New-Guid).Guid; DisplayName = 'Approver'; Value = 'Expense.Approve'; Description = 'Approve expense reports'; AllowedMemberTypes = @('User'); IsEnabled = $true }
    @{ Id = (New-Guid).Guid; DisplayName = 'Sync job'; Value = 'Expense.Sync'; Description = 'Daemon access'; AllowedMemberTypes = @('Application'); IsEnabled = $true }
)
$sp = New-MgServicePrincipal -AppId $app.AppId           # the local instance that permissions attach to

# Lab only: a short-lived secret. Prefer a certificate or a federated credential.
Add-MgApplicationPassword -ApplicationId $app.Id -PasswordCredential @{ DisplayName = 'lab'; EndDateTime = (Get-Date).AddDays(7) }

# Admin consent for the application permission = an app role assignment on the service principal
$graph = Get-MgServicePrincipal -Filter "appId eq '$graphId'"
New-MgServicePrincipalAppRoleAssignment -ServicePrincipalId $sp.Id -PrincipalId $sp.Id -ResourceId $graph.Id -AppRoleId 'df021288-bdef-4463-88db-98f22de89214'`)) +
    S('config', 'Configuration surface',
      T('config', ['Control', 'Default', 'Set it to', 'Why'], [
        ['Users can register applications', 'Yes', 'No, with Application Developer for named people', 'Every app is an identity someone must govern'],
        ['Owners', 'The creator', 'Two or more current staff', 'Orphaned apps keep their permissions'],
        ['Credential type', 'Secret', 'Federated credential or certificate', 'Secrets leak'],
        ['Implicit grant', 'Off', 'Off', 'Tokens in URLs'],
        ['Allow public client flows', 'No', 'No unless required', 'Enables device code and ROPC for the app'],
        ['App instance property lock', 'On for new multitenant apps', 'On', 'Stops other tenants changing credentials on your app’s service principal'],
        ['Application permissions', '-', 'The narrowest available (Sites.Selected over Sites.Read.All)', 'Application permissions are tenant-wide']
      ])) +
    S('failure', 'Common failure modes',
      '<p><strong>AADSTS50011 reply URL mismatch.</strong> The redirect URI in the request does not exactly match one registered on the right platform.</p>' +
      '<p><strong>Permission added, token still lacks it.</strong> Nobody granted consent. Requesting and granting are separate.</p>' +

        ['"a background service reads all users with no signed-in user"', 'Application permission + admin consent'],

AADServicePrincipalSignInLogs

    S('sources', 'Sources', '<ul>' + LEARNLI(this) +

      '</ul>' + SRCSTAMP(this));

  lab: {
    intro: 'Register one app with both permission types and two kinds of app role, then prove each by looking at real tokens.',
    steps: [
      '<p>Set <strong>Users can register applications</strong> to No. Assign Application Developer to alex and confirm alex can still register an app.</p>',
      '<p>Run the PowerShell in the module to create <em>SC300 Expenses</em>. In the portal, compare the app registration’s blades with its enterprise application’s blades and note which settings live where.</p>',
      '<p>On <strong>API permissions</strong>, observe the <em>Not granted</em> status. Grant admin consent and watch both permissions change.</p>',

      '<p>In the enterprise app, assign a Sales user the <strong>Approver</strong> role. Sign in to <code>https://jwt.ms</code> through the app (add <code>https://jwt.ms</code> as a SPA redirect URI and use an authorize URL with <code>response_type=code</code> or the MSAL sample) and find <code>roles: ["Expense.Approve"]</code>.</p>',

/* ======================================================================
   03-04  Defender for Cloud Apps
   ====================================================================== */
MODULES.push({
  id: '03-04', domain: '03', title: 'Managing App Access with Microsoft Defender for Cloud Apps', short: 'Defender for Cloud Apps',
  group: 'Manage and monitor app access by using Microsoft Defender for Cloud Apps',
  objectives: [
    'Configure and analyze cloud discovery results by using Defender for Cloud Apps',
    'Configure connected apps',
    'Implement application-enforced restrictions',
    'Configure Conditional Access app control',
    'Create access and session policies in Defender for Cloud Apps',
    'Implement and manage policies for OAuth apps',
    'Manage the Cloud app catalog'
  ],
  status: 'GA', verified: '',
  cost: { level: 'none', label: '$0', est: '$0. Defender for Cloud Apps is included in the Microsoft 365 E5 trial. Cloud discovery uses a sample or exported firewall log.', meter: 'none' },
  portal: 'Microsoft Defender portal (security.microsoft.com) &gt; Cloud apps: Cloud discovery · Cloud app catalog · OAuth apps · App governance · Policies · Settings &gt; Connected apps',
  ms: [{ t: "Plan and design the integration of enterprise apps for SSO", u: "https://learn.microsoft.com/en-us/training/modules/plan-design-integration-of-enterprise-apps-for-sso/" }, { t: "Implement and monitor the integration of enterprise apps for SSO", u: "https://learn.microsoft.com/en-us/training/modules/implement-monitor-integration-of-enterprise-apps-for-sso/" }],
  sdk: '<code>ExchangeOnlineManagement</code> <code>Microsoft.Online.SharePoint.PowerShell</code>',
  kql: '<code>CloudAppEvents</code> <code>OAuthAppInfo</code> (advanced hunting)',
  prereq: ['02-02', '03-02'],
  tactical: 'Cloud discovery is an exfiltration detector as much as a shadow IT report. Ransomware operators routinely stage data with sync tools to consumer storage before encryption, and those uploads show up as a new or spiking app in discovery - by user and device when discovery comes from Defender for Endpoint. In hunting, <code>CloudAppEvents</code> gives activity inside connected apps (mail rules, sharing, downloads) and <code>OAuthAppInfo</code> gives the privilege level, verified publisher, risk score, consent and last use of every OAuth app, which is the fastest way to spot a consented app that should not exist.',
  body: function () { return '' +
    S('concept', 'Why this exists',
      '<p>Defender for Cloud Apps is Microsoft’s cloud access security broker, now managed entirely in the Microsoft Defender portal. It answers four questions, and each objective in this group maps to one of them.</p>' +
      T('compare', ['Question', 'Capability', 'Data source'], [
        ['Which cloud apps are people using?', '<strong>Cloud discovery</strong>, scored against the <strong>cloud app catalog</strong>', 'Firewall and proxy logs, Defender for Endpoint, Global Secure Access'],
        ['What is happening inside the apps we sanction?', '<strong>Connected apps</strong> (API connectors)', 'The app’s own APIs'],
        ['Can we control a session while it happens?', '<strong>Conditional Access app control</strong>: access and session policies', 'Traffic routed through Defender for Cloud Apps'],
        ['Which OAuth apps hold access to our data?', '<strong>App governance</strong> and OAuth app policies', 'Entra consent and Graph activity']
      ])) +
    S('mechanism', 'How it works under the hood',
      '<h3>Cloud discovery and the catalog</h3>' +
      '<p><strong>Snapshot reports</strong> come from a log file you upload once; <strong>continuous reports</strong> come from a log collector (a Docker container that receives syslog or FTP from your firewall), or natively from <strong>Defender for Endpoint</strong> and Global Secure Access. Each discovered app is matched to the <strong>cloud app catalog</strong> - tens of thousands of apps, each with a <strong>risk score from 0 to 10</strong> built from general, security, compliance and legal factors. You can change how factors are weighted, request a score review, and add custom apps.</p>' +
      '<p>Tag apps <strong>Sanctioned</strong>, <strong>Unsanctioned</strong> or <strong>Monitored</strong>. With Defender for Endpoint integration and <em>Enforce app access</em> on, unsanctioned apps are blocked on managed devices through network protection indicators; for other gateways, export a block script.</p>' +
      '<h3>Connected apps</h3>' +
      '<p>An <strong>app connector</strong> uses the app’s API, authorised with an admin account or app consent, to pull activity, files, accounts and configuration - Microsoft 365, Azure, AWS, Google Cloud, Salesforce, GitHub, ServiceNow and others. For Microsoft 365 you choose components (Entra users and groups, management events, sign-ins, apps, Office 365 activities, files). Connected apps enable activity and file policies and governance actions such as suspending a user or removing a share.</p>' +
      '<h3>Application-enforced restrictions</h3>' +
      '<p>This is a Conditional Access session control (<em>Use app enforced restrictions</em>, 02-03), paired with a setting in the app itself: SharePoint and OneDrive allow limited, web-only access from unmanaged devices, and Outlook on the web goes read-only. No traffic passes through Defender for Cloud Apps; the app enforces it.</p>' +
      C('powershell', String.raw`
# The app side of application-enforced restrictions
Connect-SPOService -Url https://contoso-admin.sharepoint.com
Set-SPOTenant -ConditionalAccessPolicy AllowLimitedAccess

Connect-ExchangeOnline
Set-OwaMailboxPolicy -Identity OwaMailboxPolicy-Default -ConditionalAccessPolicy ReadOnly`) +
      '<h3>Conditional Access app control</h3>' +
      '<p>A Conditional Access policy with the session control <strong>Use Conditional Access App Control</strong> (Monitor only, Block downloads, or <em>Use custom policy</em>) hands the session to Defender for Cloud Apps. Entra-integrated apps are onboarded automatically; apps using another IdP are onboarded manually. Users of <strong>Microsoft Edge for Business</strong> get in-browser protection; other browsers are routed through a reverse proxy, visible as a <code>.mcas.ms</code> suffix on the app’s URL.</p>' +
      T('compare', ['Policy type', 'Evaluated', 'Example'], [
        ['<strong>Access policy</strong>', 'At sign-in', 'Block access to Salesforce from unmanaged devices; block native desktop clients so users cannot bypass session control'],
        ['<strong>Session policy</strong>', 'On each activity in the session', 'Block download of files labelled Confidential; block paste; protect on download with a sensitivity label; monitor only']
      ]) +
      '<h3>OAuth apps</h3>' +
      '<p><strong>App governance</strong> watches OAuth apps registered in Entra: their permissions, publisher verification, data access through Graph and usage. Its policies alert on - and can automatically <strong>disable</strong> - apps that match conditions such as <em>new app with high-privilege permissions</em>, <em>overprivileged</em> (permissions never used), <em>unused for 90 days</em> or unusual data access, and built-in threat detections flag known malicious behaviour. The <strong>OAuth apps</strong> page lets you review each app’s users and permissions and approve or ban it. App governance covers OAuth apps registered in Microsoft Entra ID, Google and Salesforce, and can take up to 10 hours to appear after you turn it on.</p>') +
    S('config', 'Configuration surface',
      T('config', ['Control', 'Default', 'Set it to', 'Why'], [
        ['Discovery source', 'None', 'Defender for Endpoint integration (continuous), plus log collector for network-only devices', 'Per user and per device, not just per IP'],
        ['Enforce app access', 'Off', 'On once unsanctioned list is reviewed', 'Tagging alone blocks nothing'],
        ['Microsoft 365 app connector', 'Off', 'On, all components', 'Activity policies and CloudAppEvents need it'],
        ['Access policy for native clients', 'None', 'Block native clients for apps under session control', 'Desktop clients bypass the proxy'],
        ['App governance policies', 'Predefined', 'Add high-privilege and unused-app policies with auto-disable', 'Stale high-privilege apps are the target'],
        ['Risk score factors', 'Defaults', 'Weight compliance factors your regulators care about', 'The score should reflect your risk']
      ])) +
    S('failure', 'Common failure modes',
      '<p><strong>Session policy never triggers.</strong> The CA policy does not use Conditional Access App Control, or the user signed in through a native client.</p>' +
      '<p><strong>Session controls never start, or sign-in loops.</strong> A Conditional Access policy blocks the <em>Microsoft Defender for Cloud Apps - Session Controls</em> enterprise app that Conditional Access app control relies on; allow it.</p>' +
      '<p><strong>Discovery shows IPs, not users.</strong> The firewall log has no user field; use Defender for Endpoint or GSA as the source.</p>' +
      '<p><strong>Unsanctioned app still reachable.</strong> Enforce app access is off, the device is not onboarded to Defender for Endpoint, or you checked too soon: Microsoft documents up to three hours from marking an app unsanctioned to the block reaching devices.</p>' +
      '<p><strong>SharePoint limited access not applied.</strong> The SharePoint tenant setting was changed but the CA policy with app enforced restrictions was not created (or vice versa) - both halves are required.</p>' +
      '<p><strong>Looking for ID Protection alerts here.</strong> They moved to Defender XDR.</p>') +
    S('exam', 'How this is tested',
      T('exam', ['Phrase in the question', 'What it steers you to'], [
        ['"identify which cloud apps users access from the firewall logs"', 'Cloud discovery (snapshot or log collector)'],
        ['"block apps with a risk score below 5 on managed devices"', 'Unsanctioned tag + Defender for Endpoint integration'],
        ['"monitor file sharing and admin activity in Salesforce via API"', 'Connected app (app connector)'],
        ['"unmanaged devices: SharePoint in the browser, no download"', 'Application-enforced restrictions'],
        ['"block download of confidential files from any cloud app on unmanaged devices"', 'Conditional Access app control + session policy'],
        ['"block access to an app from unmanaged devices at sign-in"', 'Access policy'],
        ['"detect OAuth apps with high privileges that are not used"', 'App governance policy'],
        ['"view the risk score and compliance details of an app"', 'Cloud app catalog']
      ])) +
    S('validation', 'Validation',
      C('kql', String.raw`
// Advanced hunting (Defender portal). The table refreshes hourly with a full snapshot twice a month,
// so take the latest record per app. Needs app governance turned on.
OAuthAppInfo
| summarize arg_max(Timestamp, *) by OAuthAppId
| where PrivilegeLevel == "High"
| project AppName, OAuthAppId, AppOrigin, Publisher = tostring(VerifiedPublisher.DisplayName), IsAdminConsented, ConsentedUsersCount, RiskScore, LastUsedTime, AppStatus
| order by RiskScore desc`) +
      C('kql', String.raw`
// File downloads in the last day, by user and app (needs the Microsoft 365 connector)
CloudAppEvents
| where Timestamp > ago(1d)
| where ActionType == "FileDownloaded"
| project Timestamp, AccountDisplayName, Application, ObjectName, IPAddress, DeviceType`)) +
    S('sources', 'Sources', '<ul>' + LEARNLI(this) +
      '<li>' + L('Set up cloud discovery', 'https://learn.microsoft.com/defender-cloud-apps/set-up-cloud-discovery') + '</li>' +
      '<li>' + L('Connect apps to get visibility and control', 'https://learn.microsoft.com/defender-cloud-apps/connector-platform') + '</li>' +
      '<li>' + L('Conditional Access app control', 'https://learn.microsoft.com/defender-cloud-apps/proxy-intro-aad') + '</li>' +
      '<li>' + L('Create access policies', 'https://learn.microsoft.com/defender-cloud-apps/access-policy-aad') + '</li>' +
      '<li>' + L('Create session policies', 'https://learn.microsoft.com/defender-cloud-apps/session-policy-aad') + '</li>' +
      '<li>' + L('App governance', 'https://learn.microsoft.com/defender-cloud-apps/app-governance-manage-app-governance') + '</li>' +
      '</ul>' + SRCSTAMP(this));
  },
  lab: {
    intro: 'Discover apps from a sample log, sanction and unsanction some, connect Microsoft 365, then block downloads of labelled files from unmanaged devices with a session policy.',
    steps: [
      '<p>In the Defender portal, open <strong>Cloud apps &gt; Cloud discovery</strong>, create a snapshot report and upload the sample log offered for your firewall type. Review the top apps by risk score.</p>',
      '<p>Open three discovered apps in the <strong>Cloud app catalog</strong>. Read the risk factors, tag one Sanctioned and one Unsanctioned, and look at the generated block script.</p>',
      '<p>In <strong>Settings &gt; Cloud apps &gt; Connected apps &gt; App connectors</strong>, confirm Microsoft 365 is connected with all components selected.</p>',
      '<p>Implement application-enforced restrictions: run the SharePoint cmdlet from the module and enable the CA policy CA010 from 02-03 if it is not already on.</p>',
      '<p>Create a CA policy for <code>DYN-Sales</code> targeting Office 365 with session control <strong>Use Conditional Access App Control &gt; Use custom policy</strong> (report-only off, but scoped to Sales only).</p>',
      '<p>In Defender for Cloud Apps, create a <strong>session policy</strong>: control file download, filter on unmanaged devices, action <em>Block</em>. Create an <strong>access policy</strong> blocking native clients for the same users.</p>',
      '<p>As a Sales user on an unmanaged browser, open OneDrive and try to download a file. Note the URL suffix or Edge lock icon, and the block page.</p>',
      '<p>Open <strong>App governance &gt; Policies</strong>, create a policy for apps with high-privilege permissions and no use in 30 days, action alert only. Then run the <code>OAuthAppInfo</code> hunting query.</p>'
    ],
    teardown: [
      { bucket: '1', title: 'Configuration', items: [
        'Disable the session and access policies and the CA App Control policy, or Sales users stay proxied',
        'Revert SharePoint with <code>Set-SPOTenant -ConditionalAccessPolicy AllowFullAccess</code> if you do not want the restriction' ] },
      { bucket: '2', title: 'Verify', items: [
        'A Sales user can download from OneDrive again, and no <code>.mcas.ms</code> suffix appears' ] }
    ]
  },
  quiz: [
    { q: 'You must continuously discover cloud apps used on managed Windows devices, attributed to users and devices, without deploying a log collector. What do you use?', o: ['Snapshot reports', 'Defender for Endpoint integration', 'An app connector', 'Conditional Access app control'], a: 1, obj: 0,
      why: 'Defender for Endpoint feeds cloud discovery continuously with user and device context.' },
    { q: 'Administrators need activity logs and file sharing details from Salesforce through its API. What do you configure?', o: ['Cloud discovery', 'An app connector (connected app)', 'A session policy', 'App governance'], a: 1, obj: 1,
      why: 'Connected apps use the vendor’s API for activities, files and governance actions.' },
    { q: 'Unmanaged devices must get browser-only, no-download access to SharePoint Online, enforced by SharePoint itself. What do you implement?', o: ['Conditional Access app control', 'Application-enforced restrictions', 'An access policy', 'Unsanctioning SharePoint'], a: 1, obj: 2,
      why: 'App enforced restrictions tell SharePoint to apply its limited-access experience; no proxy is involved.' },
    { q: 'Which Conditional Access session control sends a user’s session through Defender for Cloud Apps?', o: ['Use app enforced restrictions', 'Use Conditional Access App Control', 'Sign-in frequency', 'Customize continuous access evaluation'], a: 1, obj: 3,
      why: 'Use Conditional Access App Control routes the session to Defender for Cloud Apps for access and session policies.' },
    { q: 'Downloads of files labelled Confidential must be blocked from any cloud app on unmanaged devices, while viewing is allowed. What do you create?', o: ['An access policy', 'A session policy', 'A file policy', 'An activity policy'], a: 1, obj: 4,
      why: 'Session policies act on activities within a session, such as downloads; access policies decide at sign-in.' },
    { q: 'Users bypass session policies by using desktop clients. What do you add?', o: ['A session policy blocking uploads', 'An access policy blocking native clients', 'A new app connector', 'A higher risk score'], a: 1, obj: 4,
      why: 'Native clients cannot be proxied; an access policy blocks them so only browser sessions, which can be controlled, are allowed.' },
    { q: 'You want alerts, and automatic disabling, for OAuth apps with high-privilege Graph permissions that have not been used for 90 days. What do you configure?', o: ['An access review', 'An app governance policy', 'A cloud discovery policy', 'An activity policy on the Microsoft 365 connector'], a: 1, obj: 5,
      why: 'App governance policies evaluate OAuth apps by permissions, usage and behaviour and can disable them.' },
    { q: 'Where do you review an app’s risk score and the security, compliance and legal factors behind it?', o: ['OAuth apps page', 'Cloud app catalog', 'Entra enterprise applications', 'Identity Secure Score'], a: 1, obj: 6,
      why: 'The cloud app catalog holds the risk assessment for each app and lets you tag and customise it.' }

/* ======================================================================
   04-01  Entitlement management
   ====================================================================== */
MODULES.push({
  id: '04-01', domain: '04', title: 'Entitlement Management, Terms of Use and External User Lifecycle', short: 'Entitlement Management',
  group: 'Plan and implement entitlement management in Microsoft Entra',
  objectives: [
    'Plan entitlements',
    'Create and configure catalogs',
    'Create and configure access packages',
    'Manage access requests',
    'Implement and manage terms of use (ToU)',
    'Manage the lifecycle of external users',
    'Configure and manage connected organizations'
  ],
  status: 'GA', verified: '',
  cost: { level: 'none', label: '$0', est: '$0. Needs Entra ID P2 (from the E5 trial) or Entra ID Governance (in the Entra Suite trial) for the newer features.', meter: 'none' },
  portal: 'Entra admin center &gt; ID Governance &gt; Entitlement management: Catalogs · Access packages · Connected organizations · Settings · Conditional Access &gt; Terms of use · myaccess.microsoft.com',
  ms: [{ t: "Plan and implement entitlement management", u: "https://learn.microsoft.com/en-us/training/modules/plan-implement-entitlement-management/" }],
  sdk: '<code>Microsoft.Graph.Identity.Governance</code>',
  kql: '<code>AuditLogs</code> (service Entitlement Management)',
  prereq: ['01-02', '01-03'],
  tactical: 'Entitlement management answers the question every investigation eventually asks: how did this account get access to that? A direct group add leaves one audit line; an access package assignment carries the request, the justification, each approver’s decision, the policy, the expiry and the removal. When a guest turns up in a sensitive SharePoint site, the access package assignment history is the timeline, and an assignment whose approval came from a single approver who is also the requester’s sponsor is the social-engineering pattern to look for.',
  body: function () { return '' +
    S('concept', 'Why this exists',
      '<p>Access requests by email, fulfilled by an admin adding people to groups, never expire. Entitlement management replaces that with <strong>access packages</strong>: named bundles of resources that users request, someone approves, and that expire and get reviewed.</p>' +
      vNest([
        { t: 'Catalog', s: 'a container of resources and packages, with its own owners', k: 'd4' },
        { t: 'Access package', s: 'resource roles bundled for one purpose', k: 'd4' },
        { t: 'Policy', s: 'who can request, who approves, how long, reviews', k: 'acc', chips: ['Groups and teams', 'Enterprise apps and app roles', 'SharePoint sites', 'Custom extensions'] }
      ], 'Catalogs contain access packages; each package has one or more policies deciding who may get it and on what terms.') +
      '<p><strong>Planning entitlements</strong> starts from jobs, not resources: list what a role needs (the Sales team needs the CRM app, the Sales Teams team and the pricing SharePoint site), who owns each resource, who should approve, how long access should last, who outside the company needs it, and how often it is reviewed. One catalog per department or business owner lets that owner delegate without a directory role.</p>') +
    S('mechanism', 'How it works under the hood',
      '<h3>Catalogs and delegation</h3>' +
      T('compare', ['Role', 'Scope', 'Can'], [
        ['Identity Governance Administrator', 'Directory role', 'Everything in entitlement management'],
        ['Catalog creator', 'Entitlement management', 'Create catalogs and become their owner'],
        ['Catalog owner', 'One catalog', 'Add resources, create packages, manage roles in the catalog'],
        ['Access package manager', 'One catalog', 'Create and edit packages in it'],
        ['Access package assignment manager', 'One catalog', 'Assign and remove users directly'],
        ['Catalog reader', 'One catalog', 'Read']
      ]) +
      '<p>A resource must be added to a catalog before any package in it can use the resource, and the person adding it must own or administer the resource. A catalog can be marked <strong>enabled for external users</strong>; if it is not, external users cannot request its packages whatever the policy says.</p>' +
      '<h3>Access packages and policies</h3>' +
      T('config', ['Policy setting', 'Options'], [
        ['Who can request', 'Users and groups in your directory · all members (not guests) · specific connected organisations · all configured connected organisations · all users including external · none (administrator direct assignment only)'],
        ['Approval', 'None, single-stage or multi-stage; approvers can be specific users, the requestor’s manager, internal or external sponsors; fallback approvers; escalation after N days'],
        ['Requestor information', 'Justification, custom questions (text or choice), required terms of use'],
        ['Lifecycle', 'Expire after N days, on a date, or never; allow users to extend; access reviews on the assignments'],
        ['Automatic assignment', 'Attribute-based rule assigns and removes the package without a request (Entra ID Governance)'],
        ['Separation of duties', 'Incompatible access packages or groups block the request']
      ]) +
      C('powershell', String.raw`
# Catalog, a group resource, and an access package (Graph v1.0)
$cat = Invoke-MgGraphRequest -Method POST -Uri 'v1.0/identityGovernance/entitlementManagement/catalogs' -Body @{
    displayName = 'Sales'; description = 'Resources owned by the Sales department'; isExternallyVisible = $true }

$pkg = Invoke-MgGraphRequest -Method POST -Uri 'v1.0/identityGovernance/entitlementManagement/accessPackages' -Body @{
    displayName = 'Sales partner access'; description = 'Pricing site and partner Teams team for 90 days'
    catalog     = @{ id = $cat.id } }

# Who has what, and why
Invoke-MgGraphRequest -Method GET -Uri ('v1.0/identityGovernance/entitlementManagement/assignments?$expand=target&$filter=accessPackage/id eq ''' + $pkg.id + '''')`) +
      '<h3>Access requests</h3>' +
      '<p>Users request from <strong>My Access</strong> (<code>myaccess.microsoft.com</code>), or through the package’s direct link. Approvers act in My Access or from the email. Administrators follow each request under the package’s <strong>Requests</strong> blade - pending, delivered, failed - and can cancel a pending request or <strong>reprocess</strong> a failed delivery. Assignment managers can also assign users directly, and remove them.</p>' +
      '<h3>Terms of use</h3>' +
      '<p>Terms of use (<strong>Conditional Access &gt; Terms of use</strong>) is a PDF per language that users must accept. Options: <strong>require users to expand</strong> the document, <strong>require on every device</strong>, <strong>expire consents</strong> on a schedule, and a duration after which users must accept again. Enforce it either as a grant control in a Conditional Access policy (for example: guests, All resources, require terms of use) or as a requirement in an access package policy. Acceptances and declines are reported on the terms of use blade and in the audit logs.</p>' +
      '<h3>External users and connected organisations</h3>' +
      '<p>A <strong>connected organisation</strong> is a partner defined by its Entra tenant or by a domain (for partners on SAML/WS-Fed, email one-time passcode or Microsoft accounts), with optional internal and external <strong>sponsors</strong> who can approve. Its state is <strong>Configured</strong> - included in "all configured connected organisations" policies - or <strong>Proposed</strong>, which entitlement management creates automatically when someone from an unknown organisation is approved through a policy open to all users; proposed organisations are not included in configured-only policies until an admin changes the state.</p>' +
      '<p>For external users who arrived <em>through</em> entitlement management, <strong>Settings &gt; Manage the lifecycle of external users</strong> decides what happens when their last assignment ends: <strong>block sign-in</strong> and then <strong>remove the user</strong> after the number of days you set. Guests invited directly are not governed by this; use access reviews (04-02) for them.</p>') +
    S('config', 'Configuration surface',
      T('config', ['Control', 'Default', 'Set it to', 'Why'], [
        ['Assignment expiry', 'Never (if not set)', '90-365 days, extension allowed with approval', 'Access that never expires is the problem entitlement management exists to fix'],
        ['Approval for external requests', 'Configurable', 'Two stages: sponsor, then resource owner', 'One approver is one phish'],
        ['External user lifecycle', 'Configured in entitlement management settings', 'Block sign-in, then remove after a set number of days', 'Leaves no orphaned guests'],
        ['Catalog enabled for external users', 'Yes for new catalogs', 'Only for catalogs meant for partners', 'Internal-only catalogs stay internal'],
        ['Terms of use: require on every device', 'Off', 'On for guests on unmanaged devices', 'Acceptance per device, not per account'],
        ['Connected organisation state', 'Configured / Proposed', 'Review proposed ones monthly', 'Proposed orgs arrive without a sponsor']
      ])) +
    S('failure', 'Common failure modes',
      '<p><strong>External users cannot see the package.</strong> The catalog is not enabled for external users, or the policy does not include their connected organisation.</p>' +
      '<p><strong>Resource missing from the package editor.</strong> It was never added to the catalog.</p>' +
      '<p><strong>Request delivered with errors.</strong> A SharePoint site or app role could not be assigned - reprocess after fixing the resource.</p>' +
      '<p><strong>Guests never removed.</strong> They were invited directly, not through an access package, so the external user lifecycle setting does not apply.</p>' +
      '<p><strong>Terms of use prompts on every sign-in.</strong> A short expiry or per-device acceptance combined with users who clear cookies.</p>') +
    S('exam', 'How this is tested',

MODULES.push({
  id: '04-02', domain: '04', title: 'Access Reviews: Planning, Configuration and Response', short: 'Access Reviews',
  group: 'Plan, implement, and manage access reviews in Microsoft Entra',
  objectives: [
    'Plan for access reviews',
    'Create and configure access reviews',
    'Monitor access review activity',
    'Manually respond to access review activity'
  ],
  status: 'GA', verified: '',
  cost: { level: 'none', label: '$0', est: '$0 with P2 from the trial. Inactive-user reviews and machine-learning recommendations need Entra ID Governance (Entra Suite trial).', meter: 'none' },
  portal: 'Entra admin center &gt; ID Governance &gt; Access reviews · Review history · myaccess.microsoft.com &gt; Access reviews',
  ms: [{ t: "Plan, implement, and manage access review", u: "https://learn.microsoft.com/en-us/training/modules/plan-implement-manage-access-review/" }],
  sdk: '<code>Microsoft.Graph.Identity.Governance</code>',
  kql: '<code>AuditLogs</code> (service Access Reviews)',
  prereq: ['01-02', '04-01'],
  tactical: 'Access reviews are hygiene, not detection: a quarterly review will not catch a guest added last night. But the <em>inactive users</em> review finds exactly the accounts attackers prefer - dormant guests and forgotten members that nobody would notice signing in again - and review history is evidence of whether an account’s access was ever attested. When an incident involves a guest, check whether their access was reviewed, by whom, and whether the reviewer approved it from the recommendation without looking.',
  body: function () { return '' +
    S('concept', 'Why this exists',
      '<p>Access accumulates. An access review asks someone accountable - an owner, a manager, the user - whether each person still needs a specific access, and can remove access automatically when the answer is no or no answer comes.</p>' +
      T('compare', ['What can be reviewed', 'Typical reviewer'], [
        ['Members of a security or Microsoft 365 group (all, or guests only)', 'Group owners, or members themselves'],
        ['Users assigned to an enterprise application', 'App owner or business owner'],
        ['Access package assignments', 'Configured in the package policy'],
        ['Microsoft Entra roles and Azure resource roles (through PIM)', 'Role owners, security team, or self'],
        ['PIM for Groups members and owners', 'Group owners'],
        ['Inactive users across the tenant (ID Governance)', 'Managers or a named team']
      ]) +
      '<p><strong>Planning</strong> decides, per resource: who reviews (and who covers when they do not), how often, how long reviewers have, what happens to people nobody reviewed, and whether decisions apply automatically. Guests and privileged roles are reviewed more often than employee group memberships.</p>') +
    S('mechanism', 'How it works under the hood',
      T('config', ['Setting', 'Options'], [
        ['Scope', 'All users or guests only; for tenant-wide guest reviews, all Microsoft 365 groups with guests'],
        ['Reviewers', 'Group or resource owners · selected users or groups · managers of users · users review their own access; <strong>fallback reviewers</strong> when owners or managers are missing'],
        ['Multi-stage', 'Up to three stages, each with its own reviewers; later stages can see earlier decisions'],
        ['Duration and recurrence', 'Duration in days; one-time, weekly, monthly, quarterly, semi-annually or annually'],
        ['Auto apply results', 'Denied users are removed at the end without an admin'],
        ['If reviewers don’t respond', 'No change · Remove access · Approve access · Take recommendations'],
        ['Action on denied guests', 'Remove from the resource, or block sign-in for 30 days then remove from the tenant'],
        ['Decision helpers', 'Recommendations from inactivity (no sign-in for 30 days by default) and user-to-group affiliation (ID Governance)'],
        ['Justification required, notifications, reminders', 'On by default for most']
      ]) +
      C('powershell', String.raw`
# Quarterly guest review of one group, owners review, deny by default, auto-apply
$g = Get-MgGroup -Filter "displayName eq 'Sales-Partners'"
$def = @{
    displayName = 'Quarterly guest review - Sales-Partners'
    scope = @{ '@odata.type' = '#microsoft.graph.accessReviewQueryScope'
               query = '/groups/' + $g.Id + '/transitiveMembers/microsoft.graph.user/?$count=true&$filter=(userType eq ''Guest'')'; queryType = 'MicrosoftGraph' }
    reviewers = @(@{ query = "/groups/$($g.Id)/owners"; queryType = 'MicrosoftGraph' })
    settings = @{
        mailNotificationsEnabled = $true; reminderNotificationsEnabled = $true; justificationRequiredOnApproval = $true
        defaultDecisionEnabled = $true; defaultDecision = 'Deny'; autoApplyDecisionsEnabled = $true
        recommendationsEnabled = $true; instanceDurationInDays = 14
        recurrence = @{ pattern = @{ type = 'absoluteMonthly'; interval = 3 }; range = @{ type = 'noEnd'; startDate = (Get-Date -Format 'yyyy-MM-dd') } }
    }
}
New-MgIdentityGovernanceAccessReviewDefinition -BodyParameter $def`) +
      '<h3>Monitoring</h3>' +
      '<p>Each review has an <strong>Overview</strong> (reviewed, not reviewed, approved, denied), <strong>Results</strong> per user with the reviewer and justification, and for recurring reviews a history of instances. <strong>Review history</strong> produces downloadable reports across reviews for auditors. Every decision and every applied result is also written to the audit log with the service <em>Access Reviews</em> - filter on the service, because the events are spread across the Policy, UserManagement and DirectoryManagement categories.</p>' +
      '<h3>Responding manually</h3>' +
      T('compare', ['Who', 'Action', 'Where'], [
        ['Reviewer', 'Approve, Deny or Don’t know with justification; accept recommendations in bulk; change a decision until the review ends', 'My Access &gt; Access reviews, or the email'],
        ['Administrator', 'Send reminders, <strong>stop</strong> the review early, <strong>apply results</strong> manually when auto-apply is off, reset decisions', 'The review’s blade'],
        ['Owner of a denied guest’s resource', 'Nothing - denial removes access when results are applied', '-']
      ])) +
    S('config', 'Configuration surface',
      T('config', ['Control', 'Default', 'Set it to', 'Why'], [
        ['If reviewers don’t respond', 'No change', 'Remove access for guests; take recommendations for members', 'No change means the review had no effect'],
        ['Auto apply results', 'Off', 'On for guests and low-risk groups', 'Manual application is the step that gets forgotten'],
        ['Fallback reviewers', 'None', 'A named governance team', 'Groups without owners, users without managers'],
        ['Recurrence for privileged roles', '-', 'Monthly or quarterly', 'Standing privilege is the highest risk'],
        ['Justification on approval', 'On', 'On', 'Approval without a reason is rubber-stamping'],
        ['Denied guests', 'Remove from resource', 'Block sign-in, then remove from tenant (guest-only reviews)', 'Removes the account, not just one membership']
      ])) +
    S('failure', 'Common failure modes',
      '<p><strong>Review ended, nothing changed.</strong> Auto-apply was off and nobody applied the results, or the default decision was <em>No change</em>.</p>' +
      '<p><strong>Group owner review with no reviewers.</strong> The group has no owners and no fallback reviewer.</p>' +
      '<p><strong>Denied user regains access next day.</strong> They are a member through another route - a dynamic rule, a nested group, an access package - that the review did not cover.</p>' +
      '<p><strong>Cannot review a dynamic group’s members.</strong> Removing members from dynamic groups is not possible; fix the rule or the attribute instead.</p>') +
    S('exam', 'How this is tested',
      T('exam', ['Phrase in the question', 'What it steers you to'], [
        ['"review guest access to all Microsoft 365 groups every quarter"', 'Access review scoped to guests in all Microsoft 365 groups, quarterly'],
        ['"managers must confirm their reports’ app access; if they don’t, remove it"', 'Reviewers: managers; if no response: Remove access; auto-apply'],
        ['"group owners unavailable"', 'Fallback reviewers'],
        ['"help reviewers by flagging users who have not signed in"', 'Recommendations (decision helpers)'],
        ['"review who holds the Global Administrator role"', 'Access review of Entra roles through PIM'],
        ['"provide auditors a report of all review decisions"', 'Review history'],
        ['"results were not applied automatically"', 'Apply results manually from the review'],
        ['"end the review now"', 'Stop the review']
      ])) +
    S('validation', 'Validation',
      C('kql', String.raw`
AuditLogs
| where TimeGenerated > ago(90d)
| where LoggedByService == "Access Reviews"   // a service, not a category: events land in Policy, UserManagement and DirectoryManagement
| extend Actor = coalesce(tostring(InitiatedBy.user.userPrincipalName), tostring(InitiatedBy.app.displayName))
| summarize count() by Category, OperationName, Actor
| order by count_ desc`)) +
    S('sources', 'Sources', '<ul>' + LEARNLI(this) +
      '<li>' + L('What are access reviews?', 'https://learn.microsoft.com/entra/id-governance/access-reviews-overview') + '</li>' +
      '<li>' + L('Plan a Microsoft Entra access reviews deployment', 'https://learn.microsoft.com/entra/id-governance/deploy-access-reviews') + '</li>' +
      '<li>' + L('Create an access review of groups and applications', 'https://learn.microsoft.com/entra/id-governance/create-access-review') + '</li>' +
      '<li>' + L('Complete an access review', 'https://learn.microsoft.com/entra/id-governance/complete-access-review') + '</li>' +
      '<li>' + L('Review history reports', 'https://learn.microsoft.com/entra/id-governance/access-reviews-downloadable-review-history') + '</li>' +

  },
  lab: {
    intro: 'Run one review each way - owners, managers and self - and one that nobody answers, then compare what auto-apply did.',

    teardown: [
      { bucket: '1', title: 'Configuration', items: [

      { bucket: '2', title: 'Verify', items: [
