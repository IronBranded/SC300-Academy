#content[data-flash="true"] .term::after { content: "click to reveal"; font-family: var(--face-ui); font-size: var(--t-xs); color: var(--ink-faint); }
#content[data-flash="true"] .term[data-shown="true"]::after { content: none; }
.lnav { display: flex; justify-content: space-between; gap: var(--s-2); flex-wrap: wrap; margin: var(--s-6) 0 0; }
.lnav__mods { display: flex; gap: var(--s-2); flex-wrap: wrap; }
.lnav .btn { text-decoration: none; }
.lcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); gap: var(--s-3); max-width: none !important; }
.lcard { display: grid; gap: var(--s-2); align-content: start; padding: var(--s-4); border: 1px solid var(--rule); border-top: 3px solid var(--accent); border-radius: var(--radius-lg); background: var(--paper-raise); text-decoration: none; color: var(--ink) !important; }
.lcard:hover { border-color: var(--accent); }
.lcard[data-read="true"] { border-top-color: var(--cost-none); }
.lcard__id { font-family: var(--face-mono); font-size: var(--t-xs); color: var(--ink-faint); }
.lcard__s { font-size: var(--t-sm); color: var(--ink-soft); line-height: 1.45; }
.lcard__m { font-family: var(--face-ui); font-size: var(--t-xs); color: var(--ink-faint); }
.lcard__m b { color: var(--cost-none); }
.gl__bar { display: flex; flex-wrap: wrap; gap: var(--s-3); align-items: center; margin: 0 0 var(--s-4); position: sticky; top: calc(var(--h-topbar) + env(safe-area-inset-top, 0px)); background: var(--paper); padding: var(--s-2) 0; z-index: 5; }
.gl__q { flex: 1 1 16rem; padding: var(--s-2) var(--s-3); font: inherit; font-size: var(--t-sm); color: var(--ink); background: var(--paper-raise); border: 1px solid var(--rule); border-radius: var(--radius); }
.gl__letter { font-size: var(--t-lg) !important; margin: var(--s-5) 0 var(--s-2) !important; }
.gl__t { border-bottom: 1px solid var(--rule); padding: var(--s-2) 0; }
.gl__t > summary { cursor: pointer; display: flex; justify-content: space-between; gap: var(--s-3); align-items: baseline; }
.gl__t > p { margin: var(--s-1) 0 var(--s-2) !important; color: var(--ink-soft); font-size: var(--t-sm); }
.gl__src { font-family: var(--face-ui); font-size: var(--t-xs); color: var(--ink-faint); white-space: nowrap; }

/* ---------------- visual kit ---------------- */
.v { text-align: left; }
.v [data-k="acc"] { border-color: var(--accent) !important; }
.v [data-k="d1"]  { border-color: var(--domain-01) !important; }
.v [data-k="d3"]  { border-color: var(--domain-03) !important; }
.v [data-k="d4"]  { border-color: var(--domain-04) !important; }
.v [data-k="d2"]  { border-color: var(--domain-02) !important; }
.v [data-k="warn"] { border-color: var(--cost-high) !important; }
.v [data-k="ok"]  { border-color: var(--cost-none) !important; }
.vf { display: flex; align-items: stretch; justify-content: center; }
.vf__st { flex: 1 1 0; min-width: 0; display: grid; gap: 3px; align-content: center; text-align: center; padding: var(--s-2) var(--s-2); border: 1.5px solid var(--rule); border-radius: 6px; background: var(--paper); font-family: var(--face-ui); }
.vf__st strong { font-size: var(--t-sm); line-height: 1.25; }
.vf__st span { font-size: var(--t-xs); color: var(--ink-soft); line-height: 1.35; }
.vf__ar { flex: 0 0 1.4rem; display: flex; align-items: center; justify-content: center; }
.vf__ar::before { content: "\2192"; color: var(--ink-faint); font-size: 1.1rem; }
.vf__loop { margin-top: var(--s-2); text-align: center; font-family: var(--face-ui); font-size: var(--t-xs); color: var(--ink-faint); border-top: 1.5px dashed var(--rule); padding-top: var(--s-2); }
.v .vf + .vf, .v figcaption + .vf { margin-top: var(--s-3); }
@media (max-width: 640px) {
  .vf { flex-direction: column; }
  .vf__ar { flex-basis: 1.2rem; }
  .vf__ar::before { content: "\2193"; }
}
.vc { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: var(--s-2); }
.vc__c { position: relative; display: grid; gap: 3px; align-content: start; padding: var(--s-3); border: 1.5px solid var(--rule); border-radius: 6px; background: var(--paper); font-family: var(--face-ui); }
.vc__c strong { font-size: var(--t-sm); }
.vc__c > span:not(.vc__tag) { font-size: var(--t-xs); color: var(--ink-soft); line-height: 1.4; }
.vc__tag { justify-self: start; font-size: 10px !important; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; color: var(--ink-faint); border: 1px solid var(--rule); border-radius: 99px; padding: 0 6px; margin-bottom: 2px; }
.vn { border: 1.5px dashed var(--rule); border-radius: 10px; padding: var(--s-2) var(--s-3) var(--s-3); background: color-mix(in srgb, var(--paper) 70%, transparent); font-family: var(--face-ui); }
.vn .vn { margin-top: var(--s-2); border-style: solid; }
.vn__l strong { font-size: var(--t-sm); }
.vn__l span { font-size: var(--t-xs); color: var(--ink-soft); }
.vn__chips { display: flex; flex-wrap: wrap; gap: var(--s-1); margin-top: var(--s-2); }
.vn__chips span { font-size: var(--t-xs); padding: 1px 8px; border-radius: 99px; background: var(--paper-raise); border: 1px solid var(--rule); }
.vv { display: grid; grid-template-columns: 1fr auto 1fr; gap: var(--s-2); align-items: stretch; }
.vv__c { border: 1.5px solid var(--rule); border-radius: 8px; padding: var(--s-3); background: var(--paper); font-family: var(--face-ui); }
.vv__c strong { font-size: var(--t-sm); }
.vv__c ul { margin: var(--s-2) 0 0 !important; padding-left: var(--s-4) !important; font-size: var(--t-sm); }
.vv__c li { margin-bottom: 2px !important; }
.vv__x { align-self: center; font-family: var(--face-ui); font-size: var(--t-xs); font-weight: 700; color: var(--ink-faint); text-transform: uppercase; }
@media (max-width: 560px) { .vv { grid-template-columns: 1fr; } .vv__x { justify-self: center; } }
.va__title { font-family: var(--face-ui); font-size: var(--t-xs); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: var(--s-2); }
.va { display: grid; gap: 4px; }
.va__r { display: grid; grid-template-columns: 7.5rem 1fr; border: 1.5px solid var(--rule); border-radius: 6px; overflow: hidden; background: var(--paper); }
.va__l { font-family: var(--face-mono); font-size: var(--t-xs); font-weight: 700; padding: var(--s-2); background: var(--paper-raise); border-right: 1px solid var(--rule); }
.va__t { font-size: var(--t-sm); padding: var(--s-2) var(--s-3); }
@media (max-width: 560px) { .va__r { grid-template-columns: 1fr; } .va__l { border-right: 0; border-bottom: 1px solid var(--rule); } }
.vt { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.vt__k { display: grid; text-align: center; border-radius: 5px; padding: 4px 8px; font-family: var(--face-mono); }
.vt__k b { font-size: var(--t-md); font-weight: 600; white-space: pre; }
.vt__k small { font-size: 10px; color: var(--ink-faint); }
.vt__k[data-i="0"] { background: color-mix(in srgb, var(--accent) 22%, var(--paper)); }
.vt__k[data-i="1"] { background: color-mix(in srgb, var(--domain-03) 26%, var(--paper)); }
.vt__k[data-i="2"] { background: color-mix(in srgb, var(--cost-none) 24%, var(--paper)); }
.vt__k[data-i="3"] { background: color-mix(in srgb, var(--status-preview) 24%, var(--paper)); }
.vb .wg-fill[data-k="d2"] { background: var(--domain-02); }
.vb .wg-fill[data-k="warn"] { background: var(--cost-high); }
.vb > span:first-child { font-family: var(--face-mono); }
.wg-bar.vb { grid-template-columns: 6rem 1fr 3.2rem; }
.vp__cols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s-2); }
.vp__p { display: grid; gap: 4px; align-content: start; padding: var(--s-3); min-height: 8rem; border: 1.5px solid var(--rule); border-bottom: 0; border-radius: 8px 8px 0 0; background: var(--paper); font-family: var(--face-ui); text-align: center; }
.vp__p strong, .vp__base strong { font-size: var(--t-sm); }
.vp__p span, .vp__base span { font-size: var(--t-xs); color: var(--ink-soft); line-height: 1.4; }
.vp__base { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1.5px solid var(--accent); border-radius: 0 0 8px 8px; background: color-mix(in srgb, var(--accent) 12%, var(--paper)); font-family: var(--face-ui); text-align: center; }
.vp__base > div { display: grid; gap: 2px; padding: var(--s-3); }
.vp__base > div + div { border-left: 1px solid var(--accent); }
@media (max-width: 640px) { .vp__cols { grid-template-columns: 1fr 1fr; } .vp__p { border-bottom: 1.5px solid var(--rule); border-radius: 8px; min-height: 0; } }
.dg.vs { min-width: 420px; max-width: 560px; }
.vs__pt { stroke: var(--paper); stroke-width: 1.5; }
.vs__g0 { fill: var(--domain-03); } .vs__g1 { fill: var(--accent-fill); } .vs__g2 { fill: var(--cost-none); }
.vs__q { fill: var(--status-preview); }
.vs__r { fill: color-mix(in srgb, var(--status-preview) 10%, transparent); stroke: var(--status-preview); stroke-dasharray: 4 3; }
.vs__nl { stroke: var(--status-preview); stroke-width: 1.2; }
.va__arc { fill: none; stroke: var(--accent); stroke-linecap: round; }
.vconv { display: flex; flex-wrap: wrap; gap: var(--s-3); align-items: center; justify-content: center; }
.vconv__op { font-size: 1.6rem; color: var(--ink-faint); }
.vg { --cell: 2.3rem; display: grid; gap: var(--s-1); justify-items: center; }
.vg__lbl { font-family: var(--face-ui); font-size: var(--t-xs); color: var(--ink-soft); font-weight: 600; }
.vg__g { display: grid; gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
.vg__g span { width: var(--cell); height: var(--cell); display: flex; align-items: center; justify-content: center; font-family: var(--face-mono); font-size: 10px; background: var(--paper); color: var(--ink); }
@media (max-width: 560px) { .vg { --cell: 1.9rem; } }
.vw__path { fill: none; stroke: var(--accent); stroke-width: 1.4; }
.vw__cell { fill: var(--domain-03); }
.vd__sun { fill: var(--status-preview); }
.vd__hill { fill: var(--cost-none); }
.vd__n { fill: var(--ink-faint); }
.vr { display: grid; grid-template-columns: 1fr auto 1fr; gap: var(--s-3); align-items: center; }
.vr pre { margin: 0 !important; font-size: var(--t-xs) !important; line-height: 1.5; }
.vr__doc { background: #fbfaf5 !important; color: #222 !important; border-style: dashed !important; font-family: var(--face-mono); box-shadow: 2px 3px 0 var(--rule); }
.vr__ar::before { content: "\2192"; font-size: 1.4rem; color: var(--ink-faint); }
@media (max-width: 640px) { .vr { grid-template-columns: 1fr; } .vr__ar::before { content: "\2193"; } .vr__ar { text-align: center; } }
.vl { display: flex; justify-content: center; }
.vl__page { width: min(26rem, 100%); background: #fbfaf5; color: #222; border-radius: 4px; padding: var(--s-4); display: grid; gap: var(--s-3); box-shadow: 2px 3px 0 var(--rule); }
.vl__rg { position: relative; border: 2px dashed; border-radius: 4px; padding: var(--s-4) var(--s-2) var(--s-2); display: grid; gap: 5px; }
.vl__rg > span { position: absolute; top: -0.7rem; left: 0.5rem; background: #fbfaf5; padding: 0 4px; font-family: var(--face-ui); font-size: 11px; font-weight: 700; }
.vl__rg[data-r="title"] { border-color: #8764b8; } .vl__rg[data-r="title"] > span { color: #8764b8; }
.vl__rg[data-r="para"] { border-color: #0078d4; } .vl__rg[data-r="para"] > span { color: #0078d4; }
.vl__rg[data-r="table"] { border-color: #107c10; } .vl__rg[data-r="table"] > span { color: #107c10; }
.vl__rg[data-r="mark"] { border-color: #c26200; } .vl__rg[data-r="mark"] > span { color: #c26200; }
.vl__rg b { display: block; height: 8px; background: #c8c6c4; border-radius: 2px; }
.vl__rg[data-r="title"] b { height: 12px; background: #605e5c; }
.vl__tbl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
.vl__tbl i { height: 16px; border: 1px solid #a19f9d; }
.vl__rg em { font-style: normal; font-family: var(--face-ui); font-size: 13px; margin-right: 1rem; }
.vm { font-family: var(--face-mono); font-size: var(--t-xs); padding: 1px 6px; border-radius: 99px; border: 1px solid; }
.vm[data-m="extract"] { color: var(--accent); } .vm[data-m="generate"] { color: var(--domain-03); } .vm[data-m="classify"] { color: var(--cost-none); }
.vr__json { white-space: pre-wrap; word-break: break-word; }

/* ======================================================================
   SC-300 widgets
   ====================================================================== */
.cae { display: grid; gap: var(--s-4); }
.cae__sig { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: var(--s-2) var(--s-4); font-family: var(--face-ui); font-size: var(--t-sm); }
.cae__sig label { display: flex; flex-direction: column; gap: 2px; color: var(--ink-soft); }
.cae__sig select { font: inherit; color: var(--ink); background: var(--paper-raise); border: 1px solid var(--rule); border-radius: var(--radius); padding: 4px 6px; }
.cae__pols { display: grid; gap: var(--s-2); }
.cae__pol { display: grid; grid-template-columns: 1fr auto; gap: 2px var(--s-3); align-items: center; border: 1px solid var(--rule); border-left-width: 4px; border-radius: var(--radius); padding: var(--s-2) var(--s-3); font-family: var(--face-ui); font-size: var(--t-sm); background: var(--paper); }
.cae__pol strong { font-size: var(--t-sm); }
.cae__pol small { grid-column: 1 / -1; color: var(--ink-soft); }
.cae__pol[data-state="applies"] { border-left-color: var(--accent-fill); }
.cae__pol[data-state="block"] { border-left-color: var(--cost-high); }
.cae__pol[data-state="skip"] { opacity: .62; }
.cae__pol[data-state="report"] { border-left-color: var(--status-preview); border-left-style: dashed; }
.cae__tag { font-size: var(--t-xs); font-weight: 700; padding: 1px 6px; border-radius: 3px; border: 1px solid currentColor; }
.cae__pol[data-state="applies"] .cae__tag { color: var(--accent); }
.cae__pol[data-state="block"] .cae__tag { color: var(--cost-high); }
.cae__pol[data-state="skip"] .cae__tag { color: var(--ink-faint); }
