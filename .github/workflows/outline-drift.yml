name: Outline drift

# Three polls, one weekly job, one issue:
#
#   1. The skills-measured outline on the official study guide, compared with
#      docs/SKILLS-MEASURED-SNAPSHOT.md. Only the "Skills measured" section is compared
#      (date, skills at a glance, every skill area and objective), because the page's
#      front matter changes whenever Microsoft edits anything, including links.
#   2. Microsoft's Practice Assessments page still lists the SC-300 assessment
#      (assessmentId=60) that the guide links to.
#   3. The official SC-300 learning paths still contain every training module the
#      guide links from its modules.

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compare the live outline, practice assessment and training with the guide
        run: python3 verify/outline.py --live

      - name: Open an issue on drift
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const p = 'verify/out/outline.json';
            const items = fs.existsSync(p) ? JSON.parse(fs.readFileSync(p, 'utf8')) : ['See the workflow run.'];
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: 'SC-300 outline or official training changed',
              body: items.map(i => '- ' + i).join('\n') + '\n\nRun: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            });
